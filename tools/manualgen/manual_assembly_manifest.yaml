# Manual assemblage manifest — the bill of materials for the developer manual.
#
# schema: dottalk.manual.assembly_manifest.v1
# Status: PROPOSED / M2 done (dev). Not wired.
#         MANUAL-ASSEMBLY lane (docs/maintenance/MANUAL_ASSEMBLY_LANE_V1.md, AIF-035).
#         Part contracts: docs/maintenance/MANUAL_ASSEMBLY_M2_PART_CONTRACTS_V1.md
#
# This file is the *recipe*: it lists every part of the manual, in reading
# order, and records for each part where it comes from, how it is produced,
# what proof it carries, and — as of M2 — its stable anchor, the region mode
# the assembler may use, and the generator it binds to. An assembler (lane M3)
# reads this file and emits the manual; the drift gate (lane M4) fails the
# build if a `generated`/`derived` part disagrees with its source_of_record.
#
# The `class` and `direction` vocabularies are shared verbatim with the website
# content manifest (tools/fullstack_docs/website_content_manifest.yaml, AIF-033)
# so the manual and the website sit on one simplex/duplex spine.
#
#   class      generated  emitted verbatim from source into the part; hand-edits forbidden
#              derived    transformed from source with human framing; regenerate-or-review
#              maintained hand-authored, tracks a source subject; review-gate on change
#              reported   provenance-bound snapshot (evidence, attestation); append-only
#              static     hand-authored, no upstream authority (rare in a manual)
#
#   direction  S-impl     simplex: implementation/source -> manual (the spine)
#              S-rep      simplex: a report/measurement/attestation -> manual
#              authored   originated in the manual itself (editorial voice)
#              D-web      duplex: reviewed website-ORIGINATED content -> manual
#                         (per AIF-034; behaviour truth never travels this edge)

schema: dottalk.manual.assembly_manifest.v1
manual_id: developer_manual_publication_v1
title: "DotTalk++ / x64base Developer Manual"

publication_root: docs/manuals/developer/manualgen/published/developer_manual_publication_v1

# ---------------------------------------------------------------------------
# M2 — how the assembler is allowed to touch each part.
# ---------------------------------------------------------------------------
region_modes:
  whole-file:  "Assembler owns the entire file; regenerated every push; hand-edits forbidden. Fenced top/bottom with the part anchor."
  candidate:   "Assembler regenerates a REVIEW candidate; the published file changes only on human acceptance (manualgen's gated model). Used by derived parts that track source."
  authored:    "Assembler never writes. Hand-authored; review-gate only when the tracked subject changes."
  append:      "Assembler appends a provenance/evidence snapshot inside an append region; never overwrites prior snapshots."
  bind:        "Assembler binds a SET of external files (command pages, diagrams) into the reader by reference/inclusion; the set's members are generated elsewhere."

# Anchor convention: every generated/derived/reported region is delimited so the
# assembler and the drift gate can find exactly what they own.
#   <!-- MAN:BEGIN id=<part-id> gen=<generator> src=<source-of-record> -->
#   ...owned content...
#   <!-- MAN:END id=<part-id> -->
# append regions use MAN:APPEND ... MAN:END; bind regions use MAN:BIND (the set
# manifest lists members). `authored` parts carry NO anchor.
anchor_convention:
  begin: "<!-- MAN:BEGIN id={id} gen={generator} src={source} -->"
  end:   "<!-- MAN:END id={id} -->"
  append: "<!-- MAN:APPEND id={id} at={iso8601} -->"
  bind:  "<!-- MAN:BIND id={id} set={set_path} count={n} -->"

exports:
  - format: md
    role: primary
    status: committed
    output: published/developer_manual_publication_v1.md
  - format: html
    role: on-site-reader
    status: planned          # lane M5, website reader route
  - format: pdf
    role: print-export
    status: planned          # lane M5, via the pdf skill
    note: "editable DOCX intentionally deferred; revisit if a hand-off copy is needed"

provenance:
  accepted_artifact: docs/manuals/developer/manualgen/accepted_artifacts/primary_reader_artifact_v1.json
  diagram_matrix: docs/manuals/developer/manualgen/reports/diagram-publication-attachment-matrix-v1.csv
  command_reference_artifact: docs/manuals/developer/manualgen/accepted_artifacts/command_reference_artifact_v1.json
  downloads_staging: tools/fullstack_docs/build_website_feed_packet.py
  machine_profile: docs/maintenance/PINOCCHIO_MACHINE_PROFILE_CURRENT_V1.json

baseline:
  artifact_lines: 4118
  heading_count: 237
  body_sections: 9
  appendices: 4
  command_reference_pages: 191      # 164 reader-linked + 19 supplemental + 8 repair
  toc_index_glossary: none          # GREENFIELD — none generated today

# ---------------------------------------------------------------------------
# The parts, in reading order. `order` is contiguous and unique.
# `status: exists` = a real file today; `status: greenfield` = this lane builds it.
# `binding.generator` = the tool/mode that produces the part.
# `binding.exists: true`  -> a real manualgen command today.
# `binding.exists: false` -> a NEW generator specced in M2, built in M3.
# ---------------------------------------------------------------------------

# WHAT A GREEN CHECK HERE MEANS, AND WHAT IT DOES NOT (OI-024 decision 3,
# 2026-09-19).
#
# This workflow runs a build, ctest, and a draft release upload. IT RUNS
# NONE OF THE HOUSE GATES.
#
# The gates -- prepush_gate, check_cited_paths, check_house_style,
# check_header_reachability, check_open_items, the AIF and R-number collision
# gates, repository_role_guard, session_coordinator -- run at COMMIT time from a
# pre-commit hook. That hook lives in the clone's local hooks directory, which is
# NOT TRACKED, so enforcement is a property of a clone and not of this tree. A
# fresh clone enforces nothing. Measured 2026-08-31 and again 2026-09-19:
# `git ls-files` matches no hooks path and core.hooksPath is unset.
#
# So a green check on this workflow is evidence that the code BUILDS and its
# TESTS PASS. It is not evidence that the change met the house gates, and it
# must not be read as an approval they never offered. Two of these gates would
# not even be meaningful on a runner -- repository_role_guard and
# check_sandbox_git_guard ask questions about a local working copy and would go
# green by confusion.
#
# Whether the gates SHOULD run here is open and unruled; it is decision 3 of
# OI-024 in coordination/OPEN_ITEMS.md. This banner is the other half of that
# decision: until they do, say so where a reader sees the check.

name: Release beta

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-beta:
    # Pinned: windows-latest became windows-2025-vs2026 (Nov 2026), which has no
    # Visual Studio 17 2022, the generator the presets and this job name.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # The presets read VCPKG_INSTALLATION_ROOT / VCPKG_ROOT. The windows-2022
      # image does not set them (the v1.1.0-beta run failed: "Could not find
      # toolchain file: /scripts/buildsystems/vcpkg.cmake"), so bootstrap a
      # vcpkg checkout the same way build-windows.yml does and export both.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $v = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg $v
          & "$v\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_INSTALLATION_ROOT=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_ROOT=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # pro-md is the build BUILDING.md tells a reader to make (LMDB indexing +
      # Turbo Vision), so the download matches the source on main (owner ruling
      # 2026-11-27). It was windows-core, which cannot run the quickstart.
      - name: Configure
        run: cmake --preset pro-md "-DVCPKG_MANIFEST_FEATURES=tv;index;sqlite-tool"
      - name: Build and test
        run: |
          cmake --build --preset pro-md-Release --parallel
          ctest --preset pro-md-Release
      - name: Install
        shell: pwsh
        run: |
          $name = "x64base-$env:GITHUB_REF_NAME-windows-x64"
          cmake --install build --config Release --prefix "stage/$name"
          Copy-Item LICENSE,README.md,CHANGELOG.md,RELEASE_NOTES.md "stage/$name"
          Compress-Archive -Path "stage/$name" -DestinationPath "stage/$name.zip"
          (Get-FileHash "stage/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Set-Content "stage/$name.zip.sha256"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $name = "x64base-$env:GITHUB_REF_NAME-windows-x64"
          gh release create $env:GITHUB_REF_NAME `
            "stage/$name.zip" `
            "stage/$name.zip.sha256" `
            --draft `
            --title "x64base $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md

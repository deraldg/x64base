# WHAT A GREEN CHECK HERE MEANS, AND WHAT IT DOES NOT (OI-024 decision 3,
# 2026-09-19).
#
# This workflow runs the public-source policy check, an MSVC build with
# ctest, and a GCC build with ctest. IT RUNS NONE OF THE HOUSE GATES.
#
# The gates -- prepush_gate, check_cited_paths, check_house_style,
# check_header_reachability, check_open_items, the AIF and R-number collision
# gates, repository_role_guard, session_coordinator -- run at COMMIT time from a
# pre-commit hook. That hook lives in the clone's local hooks directory, which is
# NOT TRACKED, so enforcement is a property of a clone and not of this tree. A
# fresh clone enforces nothing. Measured 2026-08-31 and again 2026-09-19:
# `git ls-files` matches no hooks path and core.hooksPath is unset.
#
# So a green check on this workflow is evidence that the code BUILDS and its
# TESTS PASS. It is not evidence that the change met the house gates, and it
# must not be read as an approval they never offered. Two of these gates would
# not even be meaningful on a runner -- repository_role_guard and
# check_sandbox_git_guard ask questions about a local working copy and would go
# green by confusion.
#
# Whether the gates SHOULD run here is open and unruled; it is decision 3 of
# OI-024 in coordination/OPEN_ITEMS.md. This banner is the other half of that
# decision: until they do, say so where a reader sees the check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public-source policy
        run: python tools/ci/source_policy.py

  windows-core:
    name: Windows / MSVC core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize current MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset core-vcpkg
      - name: Build
        run: cmake --build --preset core-vcpkg --parallel
      - name: Test
        run: ctest --preset core-vcpkg
      - name: Install release shape
        run: cmake --install build/core-vcpkg --prefix stage
      - uses: actions/upload-artifact@v4
        with:
          name: x64base-${{ github.sha }}-windows-x64
          path: stage/
          if-no-files-found: error
          retention-days: 14

  ubuntu-core:
    name: Ubuntu / GCC core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool
      - name: Configure
        run: cmake --preset core-vcpkg
      - name: Build
        run: cmake --build --preset core-vcpkg --parallel
      - name: Test
        run: ctest --preset core-vcpkg

notes: 'Closes AIF-070''s last arm: disk -> memo -> RAM -> disk, with hydration as the proven inverse,
  so the round trip IS the test. Spec 44 WORKSPACE_WRITEBACK, WB_T1..WB_T11 plus fixture guard WB_G1,
  13/13 .T. RETRACTION FIRST, because this row previously claimed more than it held: the earlier version
  said "proven on BOTH toolchains" and cited a Linux transcript that is a FALSE GREEN. WORKSPACE WRITEBACK
  TO <rel>, ERASE DIR <rel> and FILE(<rel>) resolved their relative token against the PROCESS CWD while
  SET PATH DBF <rel> resolved the identical string against DATA, so the spec wrote to one directory and
  asserted against another. They coincide only because datarun.ps1 runs with cwd = DATA. The Linux run
  was made elsewhere; it wrote to dottalkpp/DBF/wbregress and read dottalkpp/data/DBF/wbregress, a directory
  the maintainer''s earlier Windows runs had populated, and reported six green markers off data it had
  not written. Worse, this row''s previous "idempotence measured, not designed -- the second Linux run
  went deliberately into the first run''s litter and still closed green" WAS that false green, recorded
  as a virtue: the run closed green because it never read its own output. Caught only when the stale
  directory was deleted as litter and the same spec, same binary, same cwd went red. See the CORRECTION
  file in related. The Windows transcript is NOT retracted -- cwd = DATA made its four resolutions agree
  -- but it is scoped to the pre-fix source. FIX: all four surfaces now route through paths::resolve_in_slot,
  the engine''s standing rule (absolute stays absolute, separators mean DATA-relative, a bare name sits
  in the slot), so a relative token names one directory to the writer, the reader, the prober and the
  teardown regardless of cwd. Windows and WSL share ONE physical tree (D:/code/ccode == /mnt/d/code/ccode),
  so the MSVC binary is STALE against those source files until rebuilt. NEW ARMS, and each shown to FAIL
  before its green was accepted (a checker is unproven until seen to fail): WB_G1 sentinel planted; WB_T7
  collision refusal writes NOTHING; WB_T8 CONFIRM does replace; WB_T9 the .__wbak backup holds the PRIOR
  content and OPENS as a 200-record table, so the undo of last resort is proven recoverable rather than
  asserted; WB_T10/WB_T11 WITH INDEXES lands the container bytes AND the mirror works after the documented
  destination BUILDLMDB rebuild. Sentinel technique, because it is reusable: writeback writes identical
  bytes every run, so "replaced" and "refused" are indistinguishable by inspection -- both leave a target
  full of correct-looking data. Mutating the landed copy first (LNAME := WBAKSENTINEL) makes the two outcomes
  differ BY VALUE. Mutation kills recorded: dropping CONFIRM from the second writeback flips T8+T9 only;
  adding CONFIRM to the first flips T7+T9 only; dropping WITH INDEXES flips T10+T11 only. WITH INDEXES
  was ALSO inert until this session: the posture parse counted index= selections and discarded the names,
  so the gather had nothing to enumerate and fell back on session attach state, landing 0 containers.
  Now posture-driven: 27 files land (15 tables/sidecars + 12 index containers), STUDENTS.cdx carrying
  6 tags. WHAT THE SPEC GUARDS is enumeration authority: the manifest comes from the posture''s AREA lines,
  never the session''s attach order, because the first cut asked the session and silently wrote 15 of
  27 files while reporting cheerful success. Refusal arms matter as much as green ones: a shortfall ABORTS
  rather than leaving a partial workspace that looks finished, and an abort leaves the filesystem untouched
  INCLUDING empty directories. Proving it forced two owner-ruled vocabulary additions the same day, because
  the markers could not otherwise assert: FILE(<path>) (no filesystem probe existed in SYSFUNC; deliberately
  broader than VFP so a leftover empty directory cannot pass an absence proof) and ERASE DIR <path> CONFIRM
  (no verb could delete a directory). INCIDENT WORTH KEEPING: the first Windows re-run was RED (FORMULA
  error on WB_T5/T6) purely because the staged exe predated the FILE() addition by 44 minutes; diagnosed
  by grepping the binary for a string only the change introduces, with the check proven both ways (0 stale
  / 1 fresh) before being trusted. SECOND INCIDENT WORTH KEEPING, and the more expensive one: the spec''s
  own header warned about stale false greens and added an ERASE DIR pre-clean to prevent exactly this.
  The pre-clean ran and reported success -- while cleaning the CWD-relative directory the reads never
  touched. A guard that shares its subject''s bug does not fail loudly, it agrees; two components agreeing
  is not evidence that either is right. STILL OWED: SYSFUNC_IMPORT_v1.csv is stale by exactly FILE, to
  be closed by metacollect regeneration rather than hand-forged. TESTING-ONLY CAVEAT, not a production
  defect (owner ruling: symlinks are fine for testing, not production): running with DATA reached through
  a symlink splits the RAM VFS -- the mount is keyed on the symlink spelling while area opens use the
  realpath, so hydration succeeds and every subsequent open fails.'

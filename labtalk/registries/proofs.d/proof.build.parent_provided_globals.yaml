id: proof.build.parent_provided_globals
label: A subproject extracted from a monolithic build inherits four invisible globals, and only two of them fail loudly
state: runtime_observed
related:
- D:/code/ccode/CMakeLists.txt
- D:/code/ccode/bindings/pydottalk/CMakeLists.txt
- D:/code/ccode/src/xbase/CMakeLists.txt
- D:/code/ccode/src/memo/CMakeLists.txt
- D:/code/ccode/src/xindex/CMakeLists.txt
- D:/code/ccode/config/build_vectors.cmake
- D:/code/ccode/build_pydottalk.ps1
notes: 'MEASURED 2026-08-17. pydottalk was a switch in the main build, then moved to
  bindings/ but kept as a SUBDIRECTORY of that build. The wrapper therefore configured
  the whole tree and ran `cmake --build --target dottalkpp pydottalk`, so producing a
  four-source Python module also built dottalkpp.exe (~400 cmd_*.cpp), dottalk_tvui.lib
  and the tvision vcpkg package. Measured from the build log: the binding links xbase,
  memo and xindex, and references dottalkpp, tvision and dottalk_tvui ZERO times.

  MAKING IT STANDALONE EXPOSED WHAT THE PARENT HAD BEEN SUPPLYING, four things, in the
  order they bit:

    1. dottalk/build_vectors.hpp -- GENERATED by the root configure from config/, and
       present in no source tree. Every xbase TU failed with "Cannot open include file".
    2. NOMINMAX -- <windows.h> defines max() as a function-like macro, so
       std::numeric_limits<T>::max() became C2589 "illegal token on right side of ::".
       30+ errors across 7 lines of dbf_file.cpp, NONE naming windows.h or max.
    3. CMAKE_MSVC_RUNTIME_LIBRARY.
    4. Seven feature flags emitted as =1/=0 (DOTTALK_WITH_INDEX, DOTTALK_HAS_XINDEX,
       five component flags).

  THE LESSON IS THE SPLIT BETWEEN 1-2 AND 3-4. The first two are compile errors: loud,
  immediate, self-correcting. The second two are SILENT. A CRT mismatch links cleanly
  and misbehaves at runtime. An undefined DOTTALK_WITH_INDEX reads as 0 under #if, so
  the module compiles a different view of the same structs than the libraries it links
  against -- it links, loads, and corrupts. Extracting a subproject and stopping when it
  compiles is therefore not done; the dangerous half produces no diagnostic at all.

  METHOD THAT ENDED THE WHACK-A-MOLE: rather than fixing one compile error at a time,
  enumerate every global the parent sets BEFORE add_subdirectory(src) -- add_compile_
  definitions, add_compile_options, include_directories, CMAKE_CXX_*, CMAKE_MSVC_* --
  and mirror the list. Four rounds of errors would have been at least six.

  WHAT WAS DELIBERATELY NOT DUPLICATED: the source lists. src/xbase|memo|xindex glob
  their own sources, and a second hand-kept copy in the lean file would be two
  restatements that drift silently, so a file added to src/xbase would land in the CLI
  and go missing from the binding. Instead ${CMAKE_SOURCE_DIR} in those three files
  became ${DOTTALK_ROOT} (six substitutions), which the root sets to the identical value
  and the lean project sets to the repo root. Same for build vectors: the emit is
  repeated, the config/ inputs are shared, so the two configures cannot disagree about
  capacity.

  A TRAP CAUGHT BEFORE IT SHIPPED: the lean file was first written as a pure standalone.
  cmake/AddPydotTalkIfPresent.cmake still add_subdirectory''s it from the root build,
  where xbase already exists -- a duplicate-target error that would have broken
  -DBUILD_PYDOTTALK=ON for the whole tree, not just the module. It now detects its mode
  via CMAKE_CURRENT_SOURCE_DIR STREQUAL CMAKE_SOURCE_DIR and skips all standalone-only
  blocks as a subdirectory. Found by asking who calls this file before assuming.

  RESULT: xbase + xindex + memo + 4 TUs -> pydottalk.cp312-win_amd64.pyd, ctest 2/2
  green, and dottalkpp.exe verified green BEFORE the lean path because the DOTTALK_ROOT
  substitution touched libraries the CLI depends on.

  LINUX RUN, 2026-08-17, and it found a FIFTH global Windows can never surface.
  Configured and built under GCC 11.4 in a mounted Linux container (cmake and pybind11
  from pip per the sandbox handoff; index mode LEGACY because lmdb will not link on
  this glibc). Every translation unit compiled -- xbase, memo, the module, all three
  extra TUs. Then the LINK failed:

    relocation R_X86_64_TPOFF32 against
    `xbase::trigger_hooks::(anonymous)::g_suppress_depth`
    can not be used when making a shared object; recompile with -fPIC

  CMAKE_POSITION_INDEPENDENT_CODE is set NOWHERE in this repository. A DLL does not
  carry the constraint, so the ROOT build with -DBUILD_PYDOTTALK=ON would hit exactly
  this the first time it ran on Linux. Fixed in the lean file; root still latent
  (OI-006).

  NOTE WHERE IT HID, because it changes the method. Not configure, not compile, but
  LINK -- naming a thread-local in an anonymous namespace three libraries deep. The
  first four globals were found by ENUMERATING what the parent sets before
  add_subdirectory(src). This fifth one is not in that list at all: it is a property of
  the OUTPUT KIND (shared module vs executable), not of the parent. No amount of
  reading the root CMakeLists would have produced it. Enumeration was necessary and
  INSUFFICIENT; only building on the other platform found it.

  AFTER THE FIX: builds, links, and IMPORTS -- pydottalk 0.4.0, 53 public members,
  Python 3.10. That import also retired a separate over-correction: the Windows wrapper
  had been made to HARD-FAIL on any interpreter but 3.12. The module is not pinned to a
  version; the real danger was a SILENT interpreter swap, which a loud warning covers
  without refusing legitimate builds.

  STILL NOT VERIFIED: the LMDB index path on any Linux host (__isoc23_strtol, the
  glibc mismatch documented in the sandbox handoff), and no run on the maintainer WSL
  host, which has a newer glibc and would settle it.'

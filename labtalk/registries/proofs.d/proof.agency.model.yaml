notes: 'Names a model the system had already IMPLEMENTED but never stated, so the mechanisms stop reading
  as unrelated engineering choices. Four legs: identity (SYSMEMBER), authority (SYSMEMROLE->SYSROLEPERM->SYSPERM),
  authentication (Argon2id token / AUTH), accountability (owner/committer in ai_runs.yaml). Exclusions
  carry the weight: capability is not agency (Ollama produces work, has no member row -- its absence is
  correct, not an omission); influence is not authority (ChatGPT planned the RBAC, member.derald committed
  it -- the attribution block exists because git records one name where the truth had three); access is
  not agency. Properties: bounded, enumerable, proven-not-claimed, delegated-never-surrendered, serialized
  when shared, time-bounded, transferable by artifact not memory, asymmetric by design (agents deliver,
  owner commits). Underlying leg-level behavior IS runtime_observed (proof.bbs.m2_net_egress = boundary
  refusal; proof.bbs.guest = designed minimal agency); the MODEL itself is source_defined. Declared gaps:
  no per-session identity, no token expiry, git agency serialized by convention not mechanism (AIF-059),
  no durable Decision audit trail. 2026-08-15 owner ruling: the USER command (src/cli/cmd_user.cpp) was
  promoted experimental -> supported with these four gaps outstanding and declared, not closed. The status
  field and this registry entry are therefore deliberately in tension: USER is supported, the agency model
  it administers remains source_defined with named gaps. Recorded so the promotion is discoverable from the
  proof side rather than only from the source header. See
  docs/maintenance/USER_COMMAND_STATUS_PROMOTION_2026-08-15.md.'

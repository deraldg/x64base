notes: 'AIF-078 gate G0. MSVC (_MSC_VER=1944): DbArea 840, AreaState 144, fstream 280, 1016 B/slot. g++/libstdc++
  x86-64: DbArea 1088, AreaState 176, fstream 528, 1296 B/slot. sizeof(XBaseEngine) is 4104 on both because
  it is only MAX_AREA*8+8 -- a pointer array with no layout freedom. The divergence is almost entirely
  std::fstream, which DbArea embeds by value. THE RESULT THAT MATTERS: the two cost axes bind on DIFFERENT
  platforms. Memory binds on Linux (1296 B/slot, 81 MB at cap 65536, 27% heavier than MSVC); stack binds
  on Windows (1 MB default main thread vs 8 MB), where the 512 KB XBaseEngine frame at 65536 is half the
  stack. The frame is identical on both platforms; only the ceiling differs. A single-toolchain measurement
  would have produced a confidently wrong cap ruling either way. PREDICTION RECORDED AND WRONG: the lane
  predicted MSVC would have the LARGER structures. It is 22% smaller. The reasoning generalised from std::string
  and std::multimap, neither of which dominates DbArea. Kept in the record because it is doctrine rule
  2 (verify the constraint is real) applied to a portability assumption rather than to a constant, and
  it is why the probe existed. Cost is paid EAGERLY: dbf_file.cpp:409-411 constructs every slot at engine
  construction, so the figures are resident with zero tables open. Probe is a CMake target (-DDOTTALK_BUILD_SLOT_COST_PROBE=ON),
  deliberately NOT registered with add_test: it is a measurement, and a test that can only pass is the
  defect class recorded in the sibling row below.'

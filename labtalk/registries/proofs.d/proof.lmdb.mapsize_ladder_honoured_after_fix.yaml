notes: 'AIF-065 FIX VERIFIED. mdb_env_set_mapsize(env_, 0) replaces the hardcoded 1 GiB at cdx_backend.cpp
  and lmdb_backend.cpp, so the attach path ADOPTS the persisted mapsize instead of asserting one. SYSARGS
  rebuilt with BUILDLMDB CLEAN TINY YES measured 33,554,432 bytes (exactly 32 MiB) and STILL measured
  33,554,432 after an index auto-attach -- delta 0. CONTROLLED COMPARISON, same table and same commands,
  only the binary differing: pre-fix 33,554,432 -> 1,073,741,824; post-fix 33,554,432 -> 33,554,432. This
  is the first time the BUILDLMDB size ladder has been observed to hold through use since it was written.
  Storage effect for this table 32x (1,073,741,824 / 33,554,432). Preceded by three pre-fix observations
  of the defect (SYSSUBCMD 31 rows, SYSFUNC 69 rows, SYSARGS 249 rows), all 128 or 32 MiB -> 1 GiB, confirming
  the assertion was independent of data volume. Note the deletion originally proposed for these two call
  sites would have been WRONG -- LMDB defaults to 10 MiB when no mapsize is set -- and passing zero is
  the documented adopt-persisted form. UNBLOCKS the x64base-vs-SQLite storage benchmark axis, which until
  now measured attach history rather than databases.'

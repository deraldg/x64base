id: proof.governance.availability_is_not_adoption
label: A foreign carrier was selected and signed because it was available -- a failure of proof, not of
  reasoning, and it passed two onboarded AI agencies
state: source_defined
source: D:/code/ccode/docs/maintenance/AIF112_OWNER_RULING_D1_D3_AND_DOGFOOD_DEFINITION_V1.md

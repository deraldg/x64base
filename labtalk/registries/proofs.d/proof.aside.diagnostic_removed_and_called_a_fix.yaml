id: proof.aside.diagnostic_removed_and_called_a_fix
label: Silencing a warning was recorded as fixing it -- the commit message is wrong on the record
state: source_defined
related:
- D:/code/ccode/tools/fullstack_docs/ecoschema_map.py
- D:/code/ccode/docs/maintenance/ECOSCHEMA_MAP_V1.html
- D:/code/ccode/labtalk/registries/proofs.d/proof.memo.zoo_orthogonality.yaml
notes: 'CORRECTION, RECORDED -- the site commit 49fd9f607 (x64base-site, branch
  codex/lean-sites-publish, 2026-08-13) carries the message "eco: return links to the site, and a
  real html/head/body so search can index it". The second clause is FALSE and cannot be rewritten,
  because the commit is pushed to a shared branch; this record is the correction. What happened --
  the ECO map page had no outer html element, and every site build printed a Pagefind line saying
  the page was being skipped. Adding html/head/body removed that line. It did not make the page
  searchable, because Pagefind indexes only pages carrying data-pagefind-body, and the site
  declares that attribute in exactly one place (app/layout.tsx on the main element) which a static
  passthrough under public/ never reaches. The page stayed unindexed, and now stayed unindexed
  SILENTLY -- strictly worse than before, since the build no longer said so. Nor would the
  attribute alone have worked: the map renders client-side from a JSON blob, Pagefind does not run
  JavaScript, and the static text on the page measured 57 words of chrome. The real fix landed
  later the same day (static_index() in ecoschema_map.py, 5,530 static words, Pagefind 156 -> 157
  pages). Two lessons worth more than the incident -- removing a diagnostic is not fixing the
  condition it reports, and a build that goes quiet is not the same as a build that goes green;
  and the check that would have caught it was in the log the whole time, one line above the
  warning, saying "Ignoring pages without this tag". Same shape as
  proof.ai_portal.discoverability_caught_its_own_author and
  proof.aside.rule_caught_its_own_author: the failure was demonstrated by the author of the fix,
  in the sitting the fix was written.'

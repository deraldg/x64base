  - id: proof.wal.memo_atomicity
    label: Whole-row atomicity including the memo store
    state: design-intended
    source: D:/code/ccode/docs/maintenance/AI_MEMO_WAL_ATOMICITY_LANE_V1.md
    notes: >-
      GAP, not yet built. An x64 memo REPLACE converts text to a stored object-id and the DBF field
      holds the id, so the WAL journals the id and never the content. A crash between the durable WAL
      commit and the memo store's own write leaves a recovered record referencing an object that may
      be absent or partial -- silent inconsistency the log cannot detect, since from its view the
      transaction committed cleanly. Fix is additive: an M <object-id> <len> <hex> record written
      before the referencing U record, replayed memo-first, under a TBJ2 version bump that still
      accepts TBJ1. cmd_replace already declares writes_memo / clears_memo_field, so the call sites to
      instrument are pre-identified. Closing this retires the COMMIT contract's own disclaimer that it
      "is not an atomic transaction across DBF, memo, and index storage."


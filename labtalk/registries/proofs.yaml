  notes: 'AIF-086, repair R-APPEND-BLANK. The command catalog (src/cli/shell_commands.cpp -> content/docs/dottalk/command-catalog.mdx)
    documents APPEND_BLANK with syntax "APPEND BLANK", but the runtime APPEND parser rejects the BLANK
    token and prints usage. THE HAZARD is not the error, it is the silence after it: with the cursor on
    the last row, the caller''s subsequent REPLACEs mutate THAT record instead of a new one -- a clobber
    indistinguishable from success to anything that does not re-count rows. Observed 2026-08-04 on build
    64a0136d through the CRUD --emit --ram fsram dry run: run 1 (APPEND BLANK) printed APPEND usage and
    left recno at 13 with row 13 overwritten; run 2 (bare APPEND, the form mem_proof.dts uses) appended
    row 14 with all 13 originals intact. This is the authored-catalog-vs-executed-engine drift the dogfood
    thesis predicts: the engine''s own self-description disagreed with the engine, and executing the engine
    caught it. Caught on a RAM table that evaporated on unmount, so the on-disk store was never at risk.
    Repair options: (a) accept BLANK as a no-op alias for bare APPEND in the parser; or (b) correct the
    catalog/HELP so APPEND BLANK is not shown as runtime syntax. crud.py emits bare APPEND. The pydottalk
    binding append_blank() works at the C++ level, so the drift is REPL-surface only.'

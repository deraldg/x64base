- id: proof.agency.model
  label: Agency model -- capacity to act plus accountability for having acted
  state: source_defined
  source: D:/code/ccode/docs/ai-friendly/AGENCY_MODEL_V1.md
  related:
  - D:/code/ccode/labtalk/lessons/student/agency_who_may_act_v0.md

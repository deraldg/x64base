  - wal_phaseB sha 16B938E4A8DA362EFE54B15E022922210CAD9117232DCF6D227CDAC21D500C7A
  - wal_phaseC sha FBA1FC92FA1CC531B8B54094D8BC644B1FA51DD13B35053D02775511A257EE54
  notes: 'Built and PROVEN 2026-07-19 in three teed phases. Phase A: COMMIT/ROLLBACK over the .tbj redo
    log with retained edits preserved (three edits to one field kept as seq 1/2/3, COMMIT landing the
    highest-priority Edit3). Phase B: CRASH RECOVERY OBSERVED -- setup left an uncommitted `U 1 1 S 2:<hex
    "Recovered">`, the runner appended `C 1`, reopening replayed it (NAME=Recovered) and removed the log.
    Phase C: buffered DELETE journals a D record and defers the DBF mutation to COMMIT, discarded on ROLLBACK,
    replayed on recovery; the buffer-off write-through DELETE path is unregressed. Format TBJ1; one durable
    fsync of the C marker BEFORE the DBF apply. CLASSIFICATION HISTORY: first entered at source_defined
    on the belief the crash window was untested. Wrong -- the evidence existed but was gitignored by a
    blanket `*.log` rule, so a partner surveying the repo could not see it. Corrected to runtime_observed
    when the proof transcripts were un-ignored and committed (AIF-062).'
- id: proof.wal.memo_atomicity
  label: Whole-row atomicity including the memo store
  state: design_intended
  source: D:/code/ccode/docs/maintenance/AI_MEMO_WAL_ATOMICITY_LANE_V1.md
  notes: 'GAP, not yet built. An x64 memo REPLACE converts text to a stored object-id and the DBF field
    holds the id, so the WAL journals the id and never the content. A crash between the durable WAL commit
    and the memo store''s own write leaves a recovered record referencing an object that may be absent
    or partial -- silent inconsistency the log cannot detect, since from its view the transaction committed
    cleanly. Fix is additive: an M <object-id> <len> <hex> record written before the referencing U record,
    replayed memo-first, under a TBJ2 version bump that still accepts TBJ1. cmd_replace already declares
    writes_memo / clears_memo_field, so the call sites to instrument are pre-identified. Closing this
    retires the COMMIT contract''s own disclaimer that it "is not an atomic transaction across DBF, memo,
    and index storage."'
- id: proof.workspace.writeback
  label: WORKSPACE WRITEBACK -- the memo/RAM to disk return leg, with its path resolution corrected
  state: runtime_observed
  source: D:/code/ccode/labtalk/proofs/runs/workspace_writeback_pathfix_proof_20260812T195516Z.log
  item_id: runtime.workspace_writeback
  return_code: 0
  related:
  - D:/code/ccode/labtalk/proofs/runs/workspace_writeback_proof_windows_20260812T180000Z.log
  - D:/code/ccode/labtalk/proofs/runs/workspace_writeback_proof_teed_20260812T174605Z.log
  - D:/code/ccode/labtalk/proofs/runs/workspace_writeback_proof_teed_20260812T174605Z.CORRECTION.md
  - D:/code/ccode/docs/maintenance/SESSION_CLOSEOUT_WORKSPACE_WRITEBACK_REGRESSION_2026-08-12.md
  - D:/code/ccode/docs/maintenance/MEMO_RESIDENT_MINIDB_V1.md
  - D:/code/ccode/dottalkpp/data/scripts/workspace_writeback.dts
  - D:/code/ccode/src/cli/cmd_workspace.cpp
  - D:/code/ccode/src/cli/cmd_erase.cpp
  - D:/code/ccode/src/cli/expr/fn_string.cpp
  - D:/code/ccode/src/cli/expr/function_catalog.cpp
  - D:/code/ccode/src/cli/cmd_regression.cpp
  notes: 'Closes AIF-070''s last arm: disk -> memo -> RAM -> disk, with hydration as the proven inverse,
    so the round trip IS the test. Spec 44 WORKSPACE_WRITEBACK, WB_T1..WB_T11 plus fixture guard WB_G1,
    13/13 .T. RETRACTION FIRST, because this row previously claimed more than it held: the earlier version
    said "proven on BOTH toolchains" and cited a Linux transcript that is a FALSE GREEN. WORKSPACE WRITEBACK
    TO <rel>, ERASE DIR <rel> and FILE(<rel>) resolved their relative token against the PROCESS CWD while
    SET PATH DBF <rel> resolved the identical string against DATA, so the spec wrote to one directory
    and asserted against another. They coincide only because datarun.ps1 runs with cwd = DATA. The Linux
    run was made elsewhere; it wrote to dottalkpp/DBF/wbregress and read dottalkpp/data/DBF/wbregress,
    a directory the maintainer''s earlier Windows runs had populated, and reported six green markers off
    data it had not written. Worse, this row''s previous "idempotence measured, not designed -- the second
    Linux run went deliberately into the first run''s litter and still closed green" WAS that false green,
    recorded as a virtue: the run closed green because it never read its own output. Caught only when
    the stale directory was deleted as litter and the same spec, same binary, same cwd went red. See the
    CORRECTION file in related. The Windows transcript is NOT retracted -- cwd = DATA made its four resolutions
    agree -- but it is scoped to the pre-fix source. FIX: all four surfaces now route through paths::resolve_in_slot,
    the engine''s standing rule (absolute stays absolute, separators mean DATA-relative, a bare name sits
    in the slot), so a relative token names one directory to the writer, the reader, the prober and the
    teardown regardless of cwd. Windows and WSL share ONE physical tree (D:/code/ccode == /mnt/d/code/ccode),
    so the MSVC binary is STALE against those source files until rebuilt. NEW ARMS, and each shown to
    FAIL before its green was accepted (a checker is unproven until seen to fail): WB_G1 sentinel planted;
    WB_T7 collision refusal writes NOTHING; WB_T8 CONFIRM does replace; WB_T9 the .__wbak backup holds
    the PRIOR content and OPENS as a 200-record table, so the undo of last resort is proven recoverable
    rather than asserted; WB_T10/WB_T11 WITH INDEXES lands the container bytes AND the mirror works after
    the documented destination BUILDLMDB rebuild. Sentinel technique, because it is reusable: writeback
    writes identical bytes every run, so "replaced" and "refused" are indistinguishable by inspection
    -- both leave a target full of correct-looking data. Mutating the landed copy first (LNAME := WBAKSENTINEL)
    makes the two outcomes differ BY VALUE. Mutation kills recorded: dropping CONFIRM from the second
    writeback flips T8+T9 only; adding CONFIRM to the first flips T7+T9 only; dropping WITH INDEXES flips
    T10+T11 only. WITH INDEXES was ALSO inert until this session: the posture parse counted index= selections
    and discarded the names, so the gather had nothing to enumerate and fell back on session attach state,
    landing 0 containers. Now posture-driven: 27 files land (15 tables/sidecars + 12 index containers),
    STUDENTS.cdx carrying 6 tags. WHAT THE SPEC GUARDS is enumeration authority: the manifest comes from
    the posture''s AREA lines, never the session''s attach order, because the first cut asked the session
    and silently wrote 15 of 27 files while reporting cheerful success. Refusal arms matter as much as
    green ones: a shortfall ABORTS rather than leaving a partial workspace that looks finished, and an
    abort leaves the filesystem untouched INCLUDING empty directories. Proving it forced two owner-ruled
    vocabulary additions the same day, because the markers could not otherwise assert: FILE(<path>) (no
    filesystem probe existed in SYSFUNC; deliberately broader than VFP so a leftover empty directory cannot
    pass an absence proof) and ERASE DIR <path> CONFIRM (no verb could delete a directory). INCIDENT WORTH
    KEEPING: the first Windows re-run was RED (FORMULA error on WB_T5/T6) purely because the staged exe
    predated the FILE() addition by 44 minutes; diagnosed by grepping the binary for a string only the
    change introduces, with the check proven both ways (0 stale / 1 fresh) before being trusted. SECOND
    INCIDENT WORTH KEEPING, and the more expensive one: the spec''s own header warned about stale false
    greens and added an ERASE DIR pre-clean to prevent exactly this. The pre-clean ran and reported success
    -- while cleaning the CWD-relative directory the reads never touched. A guard that shares its subject''s
    bug does not fail loudly, it agrees; two components agreeing is not evidence that either is right.
    STILL OWED: SYSFUNC_IMPORT_v1.csv is stale by exactly FILE, to be closed by metacollect regeneration
    rather than hand-forged. TESTING-ONLY CAVEAT, not a production defect (owner ruling: symlinks are
    fine for testing, not production): running with DATA reached through a symlink splits the RAM VFS
    -- the mount is keyed on the symlink spelling while area opens use the realpath, so hydration succeeds
    and every subsequent open fails.'
- id: proof.worktree.lane_isolation
  label: Worktree-per-lane isolation -- sessions stop sharing one working tree
  state: design_intended
  source: D:/code/ccode/docs/maintenance/AI_WORKTREE_LANE_ISOLATION_LANE_V1.md
  related:
  - D:/code/ccode/docs/ai-friendly/AI_GITLOCK_HOT_POTATO_LANE_V1.md
  notes: 'MEASURED 2026-08-02: a Cowork session worked several hours against development and found 191
    commits had landed from parallel work while it held a stale picture; three of four queued operations
    were already done by someone else, and its prepared scripts targeted a repository that no longer existed.
    Nothing was lost only because guards failed closed -- one obsolete script was a keystroke from a redundant
    546-file commit, and a broad git add would have recorded the deletion of 8 LFS files. Root cause is
    structural: every session edits the same directory on the same branch. git worktree was ALREADY tried
    and a naming convention chosen (D:\code\ccode.worktrees\); one of the two is LIVE and populated. A
    first draft called both stale, reading `prunable` from the Cowork Linux sandbox, which cannot see
    C: at all -- a vantage-point artifact, corrected. The gap is therefore not tooling and not abandonment,
    but that using the isolated path is manual and optional, so most sessions still default to the shared
    tree. Deliverables: new-lane.ps1 (refuse a taken lane number, add worktree on lane/AIF-###, drop a
    LANE.md, print the finish command) and finish-lane.ps1 (refuse uncommitted work, optional merge, remove
    + prune) -- the closing step matters as much as the opening one, since abandonment is exactly how
    the previous attempt decayed. Narrows AIF-059: worktrees make the WORKING collision structurally impossible,
    so the advisory lock only ever needed to cover the MERGE step. Does NOT solve flat append-only files
    (the intake queue is still a hotspot) or lane-number reservation. PREREQUISITE: resolve the tools/*.zip
    pointer-vs-attribute mismatch first (blobs are LFS pointers, .gitattributes says `binary` not `filter=lfs`,
    so nothing smudges them) -- otherwise every new worktree inherits the same 8 phantom deletions. Promotion
    to runtime_observed requires two live worktrees with independent status, a finish that refuses dirty
    work, a refused duplicate lane number, and no prunable entries afterward; creating one worktree proves
    nothing, as that already happened twice and still decayed.'

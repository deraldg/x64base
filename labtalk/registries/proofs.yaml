  - D:/code/ccode/docs/maintenance/MEMO_RESIDENT_MINIDB_V1.md
  - D:/code/ccode/docs/maintenance/RAM_MINIDB_MEMO_WORKSPACE_OPERATIONS_V1.md
  notes: 'QUANTUM MEMO ZOO / memo zoo / memo_zoo -- also the MINIDB and memo-resident workspace surface.
    Retrieval names first, on purpose: consumers of this registry truncate notes, so a record whose identifying
    words sit in the last paragraph is a record nobody finds. M1 SOAKED 2026-08-11 -- 20,500 generations,
    104,044 operations, four seeds, ZERO divergences; M2 concurrency UNRUN. Detail follows. Harness is
    src/memo/memo_zoo.cpp (target memo_zoo) -- six driver personas plus a shadow oracle, embedded-NUL
    and high-byte payloads, Temporal Collapse reopens, steady-state settle, final reopen sweep. Four seeds
    green -- 20260811 (500 generations / 1,584 ops), 7 (5,000 / 22,353), 42 (5,000 / 29,648, genesis population
    200), 1993 (10,000 / 50,459, reopen every 50). Totals -- 20,500 generations, 104,044 operations, about
    215 reopen cycles, ZERO divergences. What that promotes to runtime-proven at the store level -- isolation
    (no operation on memo A alters memo B), fidelity and agnosticism (every readback byte-matches the
    last write, including corrupted, binary-ish and empty payloads), and reopen durability at scale. The
    reframe that makes it rigorous -- the zoo describes memos WITH behavior, x64base memos have NONE,
    so species are DRIVER PERSONAS and the store passes by remaining a passive byte-faithful cage no matter
    what the animals do. Emergent ecology finding, replicated across all four seeds -- predation (Hawk
    merge plus Otter erase) drives every population to the floor of 8, so Merge-Hawks are apex predators
    in every world; a Turtle-bias rebalance is a tuning note, not a proof gap. STILL OPEN, and deliberately
    not covered by this record -- M2 (Sentinel as a second process, FLOCK serialization) and the hibernation
    window are UNRUN, so concurrency is claimed nowhere here. Provenance -- external stimulus, an AI-generated
    stress spec titled "Quantum Memo Zoo" supplied by the owner 2026-08-11, MAPPED into house terms rather
    than adopted verbatim (received ideas are source material, not authority). Why this record exists
    at all -- registered 2026-08-13 after the work proved unfindable. The harness, the charter and the
    four green seeds had been in the tree since 11 August and were reachable from no registry, so neither
    the ecoschema map nor site search could see them; a search of the map data for "quantum", "minidb"
    and "memo zoo" returned nothing. The evidence was never missing, only unregistered, which is the failure
    the rapid-development curation rule names.'
- id: proof.owner_dogfood_caught_cross_slot_leak
  label: A green seven-phase regression missed what two minutes of owner dogfood caught -- the proof environment
    could not express the failure
  state: source_defined
  related:
  - D:/code/ccode/src/cli/cmd_workspace.cpp
  - D:/code/ccode/dottalkpp/data/scripts/index_x64_cnx_smoke.dts
  - D:/code/ccode/docs/maintenance/TICKET_CNX_ON_X64_WARN_NOT_REFUSE_AND_WORKSPACE_OPEN_INDEX_SOURCE_V1.md
  - D:/code/ccode/docs/maintenance/GATE_GOVERNANCE_LANE_V1.md
  notes: 'THE DOGFOOD PROOFED THE DOCUMENTATION, 2026-08-09 (AIF-099). Hours after the CNX-on-x64 lane
    was proven by a seven-phase regression -- all phases PASS, adjudicated from host transcripts -- the
    owner used the feature live in the real x64 workspace and caught, from two path lines, what the regression
    could not: dbf/x64/STUDENTS.dbf was wearing indexes/x32/STUDENTS.cnx, a same-stem container built
    over the DIFFERENT x32 twin table. Root cause: cmd_workspace.cpp dirs_for_mode hard-searched the INDEXES_X32
    slot BEFORE the configured INDEXES slot whenever CNX was wanted -- the "CNX is an x32 thing" assumption
    cleared from the SET INDEX / SET ORDER guards that morning, still alive in the PATH RESOLVER. The
    policy changed; the geography had not. WHY THE REGRESSION MISSED IT, stated structurally: the INDEX_X64_CNX
    smoke runs in SANDBOX, which has a SINGLE indexes slot -- no x32/x64 split, no possible name collision,
    so the failure was INEXPRESSIBLE in the proof environment. The proof was green because it could not
    be red. This is the warm-assessor lesson (AIF-082: an inspection reads the documents while working
    the system exercises the paths) at the level of TEST ENVIRONMENTS: a proof environment that cannot
    express a failure class silently certifies it. The insidious detail: both STUDENTS tables carry 200
    rows of the same fixture data, so the foreign ordering LOOKED plausible -- the worst kind of wrong.
    FIXES: (1) dirs_for_mode reordered -- configured slot outranks the hard-coded flavor slots, which
    remain last-resort fallbacks; (2) the regression gained Scope E, a DECOY phase that plants a same-stem
    .cnx in a dir posing as the x32 slot and asserts the configured slot wins -- the known-bad made expressible,
    per the "seen it FAIL" rule. RULES REINFORCED: dogfood after proof, not instead of it (the owner rule
    that final tests promote to regressions has a converse -- live use keeps auditing the regressions);
    when a policy changes, sweep its ASSUMPTIONS out of every layer, not just the layer that refused (guards
    were fixed, the resolver was not); and for the AIF-100 gate census: a gate or proof whose environment
    cannot express its failure class must be flagged, not counted as coverage. Same family as proof.golden_rule_verify_before_assert
    and the aside/discoverability proofs: the doctrine demonstrated on its own authors, this time with
    the OWNER as the cold runner who caught it.'

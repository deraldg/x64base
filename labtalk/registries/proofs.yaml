    to TupleRow and see buffered values -- proven interactively, both directions: with rec1 buffered CSCI->MATH,
    FOR "MATH" matched it and FOR "CSCI" excluded it, so the filter reads buffered AND genuinely excludes
    (the inclusion test alone was insufficient because both fixture rows were MATH under buffering). CLASSIC
    (DISPLAY, COUNT FOR, EXPORT): both filter and render read committed data; EXPORT wrote 1,CSCI to file.
    HYBRIDS, exactly two: SQLSEL SELECT (classic predicate + tuple projection) contradicted itself --
    WHERE MAJOR="CSCI" returned a row printing MATH -- and was closed by R18 via TupleBuildOptions::overlay_table_buffer=false;
    SMARTLIST shows the identical split and remains OPEN, which matters because HELP designates it the
    preferred user-facing listing command. Remedy for SMARTLIST is definitional, not technical: pull it
    classic (committed truth, matching DISPLAY/EXPORT and the R18 decision) or push it tuple-stream (working
    view, matching SMARTBROWSER); either way its contract must say which. Method lesson retained in the
    finding doc: a scripted probe of the pager FAILED (stdin still carries the script, so SMARTBROWSER
    ate the remaining lines as pager commands); the maintainer''s interactive run is what produced proof.'

- id: proof.memo.zoo_orthogonality
  label: Quantum Memo Zoo -- memo store stays payload-agnostic and orthogonal under adversarial chaos
  state: runtime_observed
  source: D:/code/ccode/docs/maintenance/MEMO_ZOO_ORTHOGONALITY_STRESS_CHARTER_V1.md
  related:
  - D:/code/ccode/src/memo/memo_zoo.cpp

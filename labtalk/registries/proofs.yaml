  - id: proof.pdlc.dialect_ladder.dbase3_to_x64
    label: dBASE III to FoxPro 2.6 to VFP to x64 to x64 VECTOR, lossless
    state: runtime_observed
    source: D:/code/ccode/labtalk/proofs/runs/20260726T233000Z_pdlc_historical_dialect_ladder.txt
    item_id: tests/conversion/11_historical_dialect_ladder_v1.dts
    return_code: 0
    related:
      - D:/code/ccode/tests/conversion/11_historical_dialect_ladder_v1.dts
      - D:/code/ccode/src/cli/cmd_copy.cpp
      # NOT cited: docs/maintenance/HISTORICAL_XBASE_PRODUCT_FAMILY_TREE_V1.md.
      # It is the natural companion, but it is untracked and belongs to another
      # session -- citing it would put a dangling reference in the registry, the
      # exact failure the AIF-062 audit was written to stop. Add it here once
      # its owner commits it.
    notes: >-
      The historical migration demonstration proper, walked inside one engine with no external
      tool, from a genuine legacy artifact: dbf/og/STUDENTS.DBF, version byte 0x03, 200 records,
      9 fields, every field name at or under the classic 10-character cap. 200 rows and 9 fields
      at EVERY rung. GPA held N(4,2) through all four conversions -- decimal loss is silent and
      fatal, and did not occur. DOB and ENROLL_D held type D, with values byte-identical at the
      1985 end and the modern end. Unlooked-for result: the index estate migrates with the
      dialect, CNX/INX through FOX26 and VFP becoming CDX at x64. COPY converts indexes, not just
      tables. Not asserted by the pass criteria; should be in v2.

  - id: proof.pdlc.cobol_fixed_record.hop_closed
    label: DBF to fixed-record to GnuCOBOL read, 200 records
    state: runtime_observed
    source: D:/code/ccode/labtalk/proofs/runs/20260726T233000Z_pdlc_cobol_fixed_record_hop.txt
    item_id: tests/conversion/12_cobol_fixed_record_v1.dts
    return_code: 0
    related:
      - D:/code/ccode/tests/conversion/12_cobol_fixed_record_v1.dts
      - D:/code/ccode/dottalkpp/data/projects/cobol/src/first_cobol_test.cob
      - D:/code/ccode/src/edu/edu_cobol.cpp
    notes: >-
      COBOL EXPORT wrote 200 records; the file is 22,200 bytes = 200 x 111 EXACTLY. That division
      is the fidelity proof -- a fixed-record file carries no header count and no delimiters, so
      a short write is invisible to anything that merely opens and reads. GnuCOBOL compiled
      clean and the program ran: 200 student lines, RECORDS READ 0000200, exit 0. Record 1 read
      by COBOL is identical to record 1 read by DotTalk++ from the dBASE III table, GPA decimals
      included. THE COPYBOOK IS THE CROSSWALK: the FD sums to exactly 109 bytes, the dBASE III
      record length, field for field; the file's 111 is 109 plus CRLF under LINE SEQUENTIAL.
      Closing this hop required fixing two latent defects neither of which was visible to
      reading -- a BUILD/RUN extension asymmetry in edu_cobol.cpp (BUILD appended .exe on
      Windows, RUN had no fallback) and a stale ASSIGN path in the fixture naming a location
      nothing had ever written to. The PDLC review's "runtime-capable, proof incomplete" was
      right about the gap and wrong about the cause: the missing piece was never GnuCOBOL.


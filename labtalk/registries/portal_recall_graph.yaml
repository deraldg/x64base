# ---------------------------------------------------------------- edges
# Types:
#   fires_at     trigger -> doctrine. The retrieval edge.
#   requires     doctrine -> doctrine. Read the target as well.
#   evidenced_by doctrine -> the episodic record that produced it.
#   supersedes   newer -> older.
edges:
  - {from: trigger.onboard, to: seed.tier1, type: fires_at}
  - {from: trigger.onboard, to: state.tier0, type: fires_at}
  - {from: trigger.onboard, to: doctrine.repository_roles, type: fires_at}

  - {from: trigger.change_source, to: doctrine.source_mutation, type: fires_at}
  - {from: trigger.change_source, to: seed.engineering_standards, type: fires_at}

    label: about to use the runtime DEF family or EXAMPLE
  - id: trigger.understand_why
    label: asking why a rule exists
  - id: trigger.release_or_license
    label: cutting a release, defining an edition, or deciding licensing
  - id: trigger.persistent_memory
    label: working on AI memory, consolidation, recall, or the root Frontal_Mem project
  - id: trigger.where_is
    label: about to grep/find for a code or registry target -- check the search map first
  # Added 2026-08-16 (AIF-118) closing three of the four gaps AIF-115 measured:
  # seed table rows that carried guidance the resolver could not produce. An
  # agent reading the table and an agent running the resolver got DIFFERENT
  # Tier 1 guidance, and that guidance existed only in the fallback -- so the
  # fallback could not be demoted without losing it. The fourth gap, "edit the
  # website", targets the x64base-site repo and ZERO nodes point outside this
  # one; a cross-repo node convention is an owner decision, not a mechanical add.
  - id: trigger.read_write_dbf
    label: about to read or write DBF tables, memos, or indexes
  - id: trigger.use_reference_authority
    label: about to use or trust a reference authority or command/function catalog
  - id: trigger.capture_proof
    label: about to capture runtime output as proof
  # The fourth gap, closed 2026-08-16 after establishing what actually owns this.
  # It was NOT a cross-repo problem. The operative artifact an editor needs is the
  # AIF-033 lane (status: active foundation), which itself names the site's
  # website-documentation-matrix.mdx as one of its scattered ingredients. An
  # earlier pass nearly pointed this at WEBSITE_CONTENT_MANIFEST_M1_CLASSIFICATION
  # -- that is MILESTONE 1 of this same lane, already superseded by manifest v2,
  # and pointing Tier 1 at a finished milestone would advertise a superseded
  # document as the authority. Same defect as devref.hpp declaring `supported`.
  - id: trigger.edit_website
    label: about to edit or publish a page on the website
  # Added 2026-08-17 after a session spent REDISCOVERING documented ground: it
  # worked out `pip install cmake ninja --break-system-packages` by trial, and
  # diagnosed the lmdb/glibc link failure from a missing header -- both of which
  # HANDOFF_CLAUDE_COWORK_SANDBOX_BUILD_2026-08-12.md had already recorded, five
  # days earlier, in this repository. The document was reachable; nothing routed
  # anyone to it. That is AIF-082 case study 3, and the fix is a trigger rather
  # than another document nobody is pointed at.
  - id: trigger.work_in_sandbox
    label: about to build, install tooling, or run anything inside the mounted Linux sandbox


# ---------------------------------------------------------------- edges
# Types:
#   fires_at     trigger -> doctrine. The retrieval edge.
#   requires     doctrine -> doctrine. Read the target as well.
#   evidenced_by doctrine -> the episodic record that produced it.
#   supersedes   newer -> older.
edges:
  - {from: trigger.onboard, to: seed.tier1, type: fires_at}
  - {from: trigger.onboard, to: state.tier0, type: fires_at}
  - {from: trigger.onboard, to: doctrine.repository_roles, type: fires_at}

  - {from: trigger.change_source, to: doctrine.source_mutation, type: fires_at}
  - {from: trigger.change_source, to: seed.engineering_standards, type: fires_at}
  - {from: trigger.change_source, to: seed.mutation_gate, type: fires_at}
  - {from: doctrine.source_mutation, to: doctrine.representative_by_design, type: requires}

  - {from: trigger.write_dotscript, to: seed.dotscript_readiness, type: fires_at}

  - {from: trigger.open_lane, to: doctrine.lanes_and_promotion, type: fires_at}
  - {from: trigger.open_lane, to: doctrine.ownership_authorship, type: fires_at}

  - {from: trigger.commit_or_push, to: doctrine.prepush_gate, type: fires_at}
  - {from: trigger.commit_or_push, to: doctrine.repository_roles, type: fires_at}
  - {from: trigger.commit_or_push, to: doctrine.local_access, type: fires_at}
  - {from: doctrine.local_access, to: seed.local_access_checklist, type: evidenced_by}

  # doctrine.authority_chain was authored with no edges and was therefore
  # unreachable -- caught by `recall.py --validate` on the graph's first run,
  # 2026-07-31. Thesis 5.1 failing inside the artifact built to fix 5.1. Kept as
  # a comment because the near-miss is the evidence that the validator earns its
  # place.
  - {from: trigger.publish, to: doctrine.authority_chain, type: fires_at}
  - {from: doctrine.repository_roles, to: doctrine.authority_chain, type: requires}
  - {from: trigger.publish, to: doctrine.local_integration, type: fires_at}
  - {from: trigger.publish, to: doctrine.outside_ai_delivery, type: fires_at}
  - {from: trigger.publish, to: doctrine.agent_sync, type: fires_at}
  - {from: doctrine.outside_ai_delivery, to: doctrine.retrieval_failure, type: evidenced_by}

  - {from: trigger.close_out, to: doctrine.required_closeout, type: fires_at}
  - {from: trigger.close_out, to: doctrine.leave_handoff, type: fires_at}
  - {from: doctrine.leave_handoff, to: doctrine.retrieval_failure, type: evidenced_by}

  - {from: trigger.plan_gates, to: seed.scope_calibration, type: fires_at}
  - {from: trigger.plan_gates, to: seed.sdlc_fast_start, type: fires_at}
  - {from: seed.scope_calibration, to: seed.sdlc_fast_start, type: requires}
  - {from: trigger.plan_gates, to: doctrine.prove_bottleneck, type: fires_at}

  - {from: trigger.use_devtools, to: doctrine.devtools_permission, type: fires_at}

  - {from: trigger.understand_why, to: doctrine.representative_by_design, type: fires_at}
  - {from: trigger.understand_why, to: doctrine.retrieval_failure, type: fires_at}
  - {from: trigger.understand_why, to: doctrine.prove_bottleneck, type: fires_at}

  - {from: trigger.understand_why, to: doctrine.build_to_prove, type: fires_at}
  - {from: trigger.plan_gates, to: doctrine.build_to_prove, type: fires_at}
  - {from: doctrine.prove_bottleneck, to: doctrine.build_to_prove, type: requires}
  - {from: doctrine.build_to_prove, to: doctrine.retrieval_failure, type: evidenced_by}
  - {from: seed.tier1, to: doctrine.operator_contract, type: requires}
  - {from: seed.tier1, to: doctrine.mandatory_start, type: supersedes}

  # The demoted set. `supersedes` records what replaced them for ENTRY; the
  # `fires_at` edges are how they stay reachable, which is the whole point of
  # demoting rather than deleting (thesis 2.2 and 5.1 together: forget on
  # purpose, but keep a path).
  - {from: seed.tier1, to: doc.assimilation_portal, type: supersedes}
  - {from: seed.tier1, to: doc.bootstrap_card, type: supersedes}
  - {from: doctrine.authority_chain, to: doc.assimilation_book, type: requires}
  - {from: trigger.understand_why, to: doc.assimilation_book, type: fires_at}
  - {from: trigger.onboard, to: doc.bootstrap_card, type: fires_at}
  - {from: trigger.understand_why, to: doc.assimilation_portal, type: fires_at}
  - {from: doctrine.retrieval_failure, to: doc.root_portal_ancestor, type: evidenced_by}

# AI Portal recall graph v1
#
# AIF-082, 6.3. Typed, directed edges between doctrine nodes, so that recall is
# graph traversal from a trigger rather than a linear read of a 46 KB document.
#
# WHY A GRAPH AND NOT A TABLE. The memory thesis (section 5) makes reachability
# the binding constraint: "a memory that cannot be reached is, functionally, a
# memory that does not exist." This lane measured that failing four separate ways
# (charter finding C8). A flat trigger table would fix lookup; typed edges fix
# reachability, and cost roughly the same to author.
#
# THE EDGE THAT EARNS ITS KEEP is `enforced_by`. It makes the decay rule (6.6)
# COMPUTABLE rather than a matter of opinion: a doctrine node with an
# `enforced_by` edge to a HARD-FAILING gate may demote out of the entry path,
# because the gate is now the memory. A node whose gate only warns, or has none,
# may not. Measured 2026-07-31: obligations with gates held at 83-94 percent
# compliance, the one without held at 33.
#
# NODE CLASSES follow the thesis taxonomy (section 3), and the class sets the
# decay rule:
#   procedural  -- applied, not consulted. Never decays. Tier 1.
#   semantic    -- facts and settled conventions. Revised, not decayed. Tier 2.
#   episodic    -- what happened and why. Decays slowly. NEVER traded away in
#                  consolidation; section 3.4 names it the class naive designs
#                  discard, and it is why this corpus persuades.
#
# Resolver: labtalk/ai_portal/recall.py

schema: portal-recall-graph-v1
lane: AIF-082
owner: member.derald
created_utc: 2026-07-31T20:30:00Z

# ---------------------------------------------------------------- triggers
# The entry points. An agent names what it is ABOUT TO DO; the resolver walks
# outward from here. Recall is inverse triage (thesis 5.4): expand a query into
# the smallest working set that restores competence, not everything relevant.
triggers:
  - id: trigger.onboard
    label: starting cold, no context
  - id: trigger.change_source
    label: about to change source code

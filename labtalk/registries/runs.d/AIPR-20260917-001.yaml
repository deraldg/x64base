notes: Catalog, live session, MINIDB, command console, native table/memo views, buffered scalar editing, portable image save/reopen, live memo image inspection, exact selected-image export, buffered image storage in DTX memo fields and workspace-scoped table navigation locally built and tested on Windows. Continuation handles CODEX-20260917-UIDEF-LIVE, CODEX-20260917-UIDEF-MINIDB, CODEX-20260917-UIDEF-LIST, CODEX-20260918-UIDEF-BROWSE, CODEX-20260918-UIDEF-EDIT, CODEX-20260918-UIDEF-SAVE, CODEX-20260918-UIDEF-MEMOIMAGE, CODEX-20260918-UIDEF-EXPORT, CODEX-20260918-UIDEF-STOREIMAGE, CODEX-20260918-UIDEF-NAV and CODEX-20260918-UIDEF-PATHS. Command registry measured at 310 names including aliases. BROWSE and native editing share selection, order, visibility and buffers with the engine. Scoped MINIDB saves exclude peer bytes, preserve duplicate basenames and reopen committed data in fresh sessions. A live memo can be inspected as an image and hydrated with field provenance. Selected root and nested images export without rewriting, preserve live buffers and hydrate in fresh sessions. Store image preserves shared old objects, stages a new reference and passes rollback, commit/reopen and RAM table child-hydration checks. Tables browsing supports independent descendant scope and all-workspace name search, with numeric global Area values and stable filtered-row identity. Eight native programs and fourteen window modes pass, plus real default startup from an unrelated directory. Native INIT, path settings and WORKSPACES/WORKSPACES.dbf defaults are integrated; RESET roots survive workspace switching. Source and evidence are uncommitted; no lane closure or publication claim. Command-load visibility continuation CODEX-20260918-UIDEF-LOADVIEW passed native directory, command/script MINIDB, nested image and actual-open-count checks plus generated window navigation; updated preview is side by side with the preserved earlier executable. Open/Load and flow continuation CODEX-20260918-UIDEF-OPENLOAD passed eight native programs and fifteen window modes, console areas 0..12/13..55, 512-area RAM capacity and twelve repeated save/reopen checks. NEW activates, SWITCH selects the first open area or unused area when empty; numeric Area replaces redundant identity columns. Reset per-session compatibility cache to prevent stale area pointers across engine recreation. M1 continuation CODEX-20260918-UIDEF-M1 completed locally on Windows; six generated native menus, four generated modal forms, nineteen modal lifetimes with cancellation and keyboard checks, eight native programs plus the design check and sixteen window modes. Source/evidence remain uncommitted; M2 is next. M1 file-location continuation CODEX-20260918-UIDEF-FILEPATHS removes DO and workspace-file cwd fallback, adds the generated Run script modal, and verifies duplicate names, native overrides, caller-relative scripts and exact quoted filenames. Eight native programs, design check and sixteen window modes pass with twenty-three modal lifetimes and unchanged input catalog hashes. ERSATZ policy is unchanged. Preview is arctictalk_workbench_filepaths.exe. Schema-location continuation CODEX-20260918-UIDEF-LOADROOTS adds explicit table/index roots in Load, shared native preflight with modal missing-table correction, worker recheck and per-load default restoration. Nine registered checks and sixteen window modes pass; real-schema private copies load and read all twelve MCC and ten Help tables with unchanged source hashes. Preview is arctictalk_workbench_loadroots.exe; source and evidence uncommitted. M2 continuation CODEX-20260918-UIDEF-M2 completes the native workspace/table tree with ancestor-preserving search, stable identity and expansion, explicit SWITCH/SELECT, context menus and keyboard actions. Nine registered checks and sixteen window modes pass, including 27 navigator stages and tree/engine agreement after hydration and commands. Shutdown notification lifetime was corrected and three extra live-session lifetimes exited cleanly. Preview is arctictalk_workbench_m2.exe. Source and evidence remain uncommitted; M3 is next. Comparison audit CODEX-20260918-UIDEF-COMPARISON inspected the older native catalog UI and generated M2 pages, measured matching 112-row native/Python action catalogs, and recorded source-only limits. Added a planned direct catalog-load/RAM-hydration prerequisite before M3, Record View reuse in M3, and explicit DDict scope in M4. No application source changes or implementation proof in this audit. Audit documents and evidence remain local and uncommitted. Catalog-flow continuation CODEX-20260918-UIDEF-CATALOGFLOW implements direct selected-version Hydrate to RAM and Load definition actions. Nine registered checks and seventeen window modes pass, including historical duplicate-name identity, Ada disk/RAM readback, modal correction/cancellation, pending-edit and stale-context refusal. Fixed and reverified a startup abort caused by direct control lookup. Original catalog hashes were unchanged at the automated-test boundary. Later passive UI observation showed live mcc_db_ram with 13 RAM tables and a new catalog image row; see closeout. Preview is arctictalk_workbench_catalogflow.exe; source/evidence remain uncommitted and M3 remains planned.

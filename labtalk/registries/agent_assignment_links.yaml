join_routes:
  - id: agent_assignment_link.identity_route
    label: Agent to Assignment
    kind: relation_route
    status: source_defined
    project: project.ai_systems.integration
    lane: AIF-086
    from: SYSCHATLNK.MEMBERID
    through: SYSCHATLNK.ASSIGNID
    to: [SYSMEMBER.ID, SYSASSIGN.ID]
    invariant: SYSCHATLNK.MEMBERID must equal SYSASSIGN.MEMBERID

  - id: agent_assignment_link.conversation_route
    label: Shared Multi-Agent Conversation
    kind: relation_route
    status: source_defined
    project: project.ai_systems.integration
    lane: AIF-086
    from: SYSCHATLNK.LINKKEY
    through: SYSCHATLNK.CONVKEY
    to: SYSCHATLNK.CONVKEY
    invariant: each assignment has one LINKKEY while all participants share CONVKEY

  - id: agent_assignment_link.bbs_route
    label: Conversation to AI-BBS and Pseudo-Chat
    kind: relation_route
    status: source_defined
    project: project.ai_systems.integration
    lane: AIF-086
    from: [SYSCHATLNK.BBSBOARD, SYSCHATLNK.BBSTHRID]
    through: [SYSBOARD.BKEY, SYSTHREAD.ID]
    to: SYSPOST.THREADID
    evidence_link: SYSCHATLNK.RUNID

  - id: agent_assignment_link.ui_route
    label: Conversation to Project Name and UI Position
    kind: relation_route
    status: observational
    project: project.ai_systems.integration
    lane: AIF-086
    from: SYSCHATLNK.PROJKEY
    through: [SYSCHATLNK.TITLE, SYSCHATLNK.UISECT, SYSCHATLNK.UIPOS, SYSCHATLNK.PINPOS]
    to: provider_sidebar_projection
    invariant: UI fields are mutable observations and never identifiers

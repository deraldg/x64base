  - id: agent_assignment_link.regression
    label: Create and Read SYSCHATLNK in X64
    kind: dottalk_script
    path: ../dottalkpp/data/scripts/ddl/syschatlnk_x64_regression.dts
    script: ../dottalkpp/data/scripts/ddl/syschatlnk_x64_regression.dts
    proof_output_dir: proofs/runs
    status: proof_passed
    truth_state: runtime_observed
    proof_state: validated
    proof: proofs/runs/20260816_101951_agent_assignment_link_regression.txt
    project: project.x64base.runtime
    lane: AIF-086
    run: AIPR-20260816-001
    safety: DISPOSABLE_TMP_WRITE
    mutation: creates_and_overwrites_only_SYSCHATLNK_proof_files_under_configured_TMP
    observed_result: Current development runtime validated and created the X64 DBF, reopened it, and passed link key, conversation key, assignment, locale, and timestamp readbacks with portal output acceptance accepted.
    observed_warning: Runtime initialization reported the pre-existing optional BibleTalk SQLite seed warning; it did not affect DDL validation, creation, readback, or output acceptance.
    required_output_patterns:
      - "SYSCHATLNK_T1_LINKKEY:.T."
      - "SYSCHATLNK_T2_CONVKEY:.T."
      - "SYSCHATLNK_T3_ASSIGN:.T."
      - "SYSCHATLNK_T4_LOCALE:.T."
      - "SYSCHATLNK_T5_TIMES:.T."


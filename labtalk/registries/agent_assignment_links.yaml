v1_compatibility_routes:
  - id: agent_assignment_link.identity_route
    label: Agent to Assignment
    kind: relation_route
    status: source_defined
    schema_version: syschatlnk_v1_compatibility
    project: project.ai_systems.integration
    lane: AIF-086
    from: SYSCHATLNK.MEMBERID
    through: SYSCHATLNK.ASSIGNID
    to: [SYSMEMBER.ID, SYSASSIGN.ID]
    invariant: SYSCHATLNK.MEMBERID must equal SYSASSIGN.MEMBERID

  - id: agent_assignment_link.conversation_route
    label: Shared Multi-Agent Conversation
    kind: relation_route
    status: source_defined
    schema_version: syschatlnk_v1_compatibility
    project: project.ai_systems.integration
    lane: AIF-086
    from: SYSCHATLNK.LINKKEY
    through: SYSCHATLNK.CONVKEY
    to: SYSCHATLNK.CONVKEY
    invariant: each assignment-conversation participation has one LINKKEY while all participants in the local conversation share CONVKEY

  - id: agent_assignment_link.bbs_route
    label: Conversation to AI-BBS and Pseudo-Chat
    kind: relation_route
    status: source_defined
    schema_version: syschatlnk_v1_compatibility
    project: project.ai_systems.integration
    lane: AIF-086
    from: [SYSCHATLNK.BBSBOARD, SYSCHATLNK.BBSTHRID]
    through: [SYSBOARD.BKEY, SYSTHREAD.ID]
    to: SYSPOST.THREADID
    evidence_link: SYSCHATLNK.RUNID

  - id: agent_assignment_link.ui_route
    label: Conversation to Project Name and UI Position
    kind: relation_route
    status: observational
    schema_version: syschatlnk_v1_compatibility
    project: project.ai_systems.integration
    lane: AIF-086
    from: SYSCHATLNK.PROJKEY
    through: [SYSCHATLNK.TITLE, SYSCHATLNK.UISECT, SYSCHATLNK.UIPOS, SYSCHATLNK.PINPOS]
    to: provider_sidebar_projection
    invariant: UI fields are mutable observations and never identifiers

normalized_candidate_routes:
  - id: agent_assignment_link.v2_participant_route
    label: V2 Project, Conversation, Assignment, and Member Route
    kind: relation_route
    status: review_needed
    truth_state: source_defined
    proof_state: design_intended
    schema_version: normalized_candidate_v2
    project: project.ai_systems.integration
    lane: AIF-086
    run: AIPR-20260816-002
    from: SYSCHCTX.CTXKEY
    joins:
      - SYSCHCTX.CONVID = SYSCONV.ID
      - SYSCHATLNK.CONVID = SYSCONV.ID
      - SYSCHATLNK.ASSIGNID = SYSASSIGN.ID
      - SYSASSIGN.MEMBERID = SYSMEMBER.ID
    context_kind: project
    relation_role: approved_primary_project_context
    active_only: true
    primary_only: true
    to: SYSMEMBER.ID
    invariant: context labels and AIF values never replace project, task, conversation, link, assignment, or member keys

  - id: agent_assignment_link.v2_provider_ui_route
    label: V2 Provider Route and UI Observation
    kind: relation_route
    status: review_needed
    truth_state: source_defined
    proof_state: design_intended
    schema_version: normalized_candidate_v2
    project: project.ai_systems.integration
    lane: AIF-086
    run: AIPR-20260816-002
    from: SYSCHATLNK.ID
    joins:
      - SYSCHPART.LINKID = SYSCHATLNK.ID
      - SYSCHPART.ROUTEID = SYSCHROUTE.ID
      - SYSCHRPRV.ROUTEID = SYSCHROUTE.ID
      - SYSCHATUI.PARTID = SYSCHPART.ID
    latest_by: [SYSCHATUI.OBSAT, SYSCHATUI.ID]
    to: provider_sidebar_projection
    invariant: model, title, section, position, pin, and archive come from the latest append-only observation

  - id: agent_assignment_link.v2_bbs_route
    label: V2 Conversation to Durable AI-BBS
    kind: relation_route
    status: review_needed
    truth_state: source_defined
    proof_state: design_intended
    schema_version: normalized_candidate_v2
    project: project.ai_systems.integration
    lane: AIF-086
    run: AIPR-20260816-002
    from: SYSCONV.ID
    joins:
      - SYSCHROUTE.CONVID = SYSCONV.ID
      - SYSCHRBBS.ROUTEID = SYSCHROUTE.ID
      - SYSCHRBBS.THREADID = SYSTHREAD.ID
      - SYSPOST.THREADID = SYSTHREAD.ID
    to: SYSPOST.ID
    invariant: the BBS route uses the shared BBS carrier while each durable message records its actual writer session

  - id: agent_assignment_link.v2_message_provenance_route
    label: V2 Message Origin, Actor, Principal, and Writer Route
    kind: relation_route
    status: review_needed
    truth_state: source_defined
    proof_state: design_intended
    schema_version: normalized_candidate_v2
    project: project.ai_systems.integration
    lane: AIF-086
    run: AIPR-20260816-002
    from: SYSPOSTLNK.MSGKEY
    joins:
      - alias: origin_participant
        type: left
        on: SYSPOSTLNK.ORIGPART = SYSCHPART.ID
      - alias: bbs_post
        type: left
        on: SYSPOSTLNK.POSTID = SYSPOST.ID
      - alias: actor_member
        type: inner
        on: SYSPOSTLNK.ACTORID = SYSMEMBER.ID
      - alias: principal_member
        type: inner
        on: SYSPOSTLNK.PRINCIPAL = SYSMEMBER.ID
      - alias: writer_session
        type: inner
        on: SYSPOSTLNK.WRITESESS = SYSCHSESS.ID
      - alias: writer_connector
        type: inner
        on: SYSCHSESS.CONNID = SYSCHCONN.ID
    to: SYSCHCONN.ID
    invariant: content origin, acting BBS member, authenticated/transcribing principal, and recording process are distinct facts

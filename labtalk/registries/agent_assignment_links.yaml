    mutation: creates_and_overwrites_only_SYSCHATLNK_proof_files_under_configured_TMP
    observed_result: Current development runtime validated and created the X64 DBF, reopened it, and passed link key, conversation key, assignment, locale, and timestamp readbacks with portal output acceptance accepted.
    observed_warning: Runtime initialization reported the pre-existing optional BibleTalk SQLite seed warning; it did not affect DDL validation, creation, readback, or output acceptance.

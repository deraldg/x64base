# AI run traceability registry v1  (AIF-050 M1)
#
# One row per working session of a member on the project. This is the "return to
# the last agent" index: resolve a lane -> its newest run -> the chat handle.
#
# owner/authority: member.derald  (not delegated by any assignment below)
# contract: docs/maintenance/AI_RUN_TRACEABILITY_CONTRACT_V1.md
# lane: AIF-050 (docs/maintenance/AI_RUN_TRACEABILITY_LANE_V1.md)

runs_registry:
  schema: ai-runs-v1
  status: candidate            # dev-only; not promoted
  contract: docs/maintenance/AI_RUN_TRACEABILITY_CONTRACT_V1.md

  required_fields:
    - run_id
    - member
    - project
    - lanes
    - handle_binding
    - status

  handle_bindings:
    - SELF_REPORTED             # agent supplied a resolvable handle
    - MAINTAINER_ATTESTED       # platform stamped id not_exposed; owner attests
    - NOT_RESOLVABLE            # no handle; closeout is the only recovery path

# ---------------------------------------------------------------------------
# Runs (newest first). chat_handle == "" with MAINTAINER_ATTESTED means the
# owner still needs to record the resumable handle; the run is fully recovered
# from its closeout regardless (the closeout, not the chat, is the record).
# ---------------------------------------------------------------------------
runs:
  - run_id: AIPR-20260730-001
    member: member.ai.claude.cowork
    product: Cowork                         # Anthropic / Cowork; model not_exposed
    project: project.x64base.runtime
    lanes: [AIF-078]                        # workspace qualifier namespace depth
    role: analyst                           # design + decision lane; NO engine source committed
    authored_by: member.ai.claude.cowork

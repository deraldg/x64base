# ---------------------------------------------------------------------------
# The "return to the last agent" index (AIF-050 M5). For each lane, the newest
# run holds the most current knowledge. Resolve: lane -> run_id -> chat_handle
# (reopen if the binding is resolvable; otherwise the run's closeout is the
# recovery path). This map is the queryable form of the "Last agent:" line the
# lane docs and dashboard carry.
# ---------------------------------------------------------------------------
current_by_lane:
  AIF-078: AIPR-20260730-001      # workspace qualifier namespace depth -- Cowork/Claude, active (G4 open)
  AIF-074: AIPR-20260729-001      # SQLSEL PLDC lane charter -- Cowork/Claude, active
  AIF-069: AIPR-20260727-001      # EXPORT SDF fixed-width output -- Codex, closed
  AIF-050: AIPR-20260725-001      # AI run traceability / @dottalk.file contract -- full-tree backfill 100%, Cowork/Claude
  AIF-046: AIPR-20260722-007      # scan-evaluator — Cowork/Claude, same session
  AIF-045: AIPR-20260722-005      # identity/RBAC — Cowork-implemented, ChatGPT-planned, closed
  AIF-052: AIPR-20260725-001      # AI-BBS agent-server -- Cowork/Claude, active
  AIF-053: AIPR-20260725-001      # NET egress-security + Argon2id crypto
  AIF-054: AIPR-20260725-001      # M6 standalone daemon + The Lounge
  AIF-055: AIPR-20260725-001      # guest leave-a-message (Guestbook)
  AIF-056: AIPR-20260725-001      # AI Portal onboarding hardening (engineering-standards seed)
  AIF-057: AIPR-20260725-001      # AI-BBS worklog/handoff simplex drop-point (small end built)
  AIF-058: AIPR-20260725-001      # AI roles taxonomy (agents vs Ollama vs GPTbase)
  AIF-059: AIPR-20260725-001      # git-lock Hot Potato commit-coordination (design)
  AIF-060: AIPR-20260725-001      # agency model + human-readable reports
  AIF-061: AIPR-20260725-001      # memo/WAL atomicity (design) + stale-stub correction
  AIF-062: AIPR-20260725-001      # evidence layer versioning -- proof registry made verifiable

current_by_project:
  project.x64base.runtime: AIPR-20260727-001
  project.x64base.identity: AIPR-20260722-005
  project.ai_friendly: AIPR-20260725-001

# Notes:
#  - member.ai.chatgpt appears only as planned_by on the identity runs: ChatGPT (OpenAI) authored the
#    RBAC plan; Cowork/Claude implemented it; member.derald owns and committed it. That three-way split
#    is exactly what git cannot show (git author == member.derald on every commit).
#  - handle_binding is MAINTAINER_ATTESTED on every seeded run because the platform stamps the session
#    id not_exposed. Filling chat_handle is an owner action; the runs lose nothing meanwhile.
#  - To resume the freshest agent for a lane: current_by_lane[LANE] -> runs[run_id].chat_handle.

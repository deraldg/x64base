# AI report discoverability index v1
#
# Purpose
# -------
# The single lookup layer for AI-authored reports and received external-AI
# change packages. Resolve any report by `report_id`, provider, `kind`, or a
# free-text `alias` WITHOUT grepping the working tree. This exists because the
# audit validator (`labtalk/ai_portal/audit_trail.py`) historically scanned only
# `docs/maintenance/SESSION_CLOSEOUT_*.md`, leaving received external-AI packages
# under `docs/maintenance/external_ai_intake/` unindexed and effectively
# undiscoverable (see AIPR-20260728-002).
#
# Landing-zone convention
# -----------------------
# Received external-AI packages are preserved unchanged under
#   docs/maintenance/external_ai_intake/<concept-slug>_<YYYY-MM-DD>/
# and MUST be added here (report_id, provider, date, kind, topics, aliases,
# path, status). `aliases` carries the maintainer's spoken concept vocabulary so
# a description like "virtual databases / object-oriented memos" resolves to the
# right report even when the folder slug does not contain those words.
#
# Maintenance
# -----------
# Manually seeded now. Once `audit_trail.py` gains an
# `external_intake_glob: docs/maintenance/external_ai_intake/**/MANIFEST.md`
# (proposed Part C in INTAKE_DISCOVERABILITY_GAP_AND_FIX_V1.md), this file is
# emitted/refreshed on each audit run. External AIs may only propose entries;
# the maintainer commits.

schema: ai-report-index-v1
status: active_seed
generated_by: manual_seed (AIPR-20260728-002)
landing_zone: docs/maintenance/external_ai_intake/


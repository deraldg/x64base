    notes: The DotScript command/expression language surface, promoted from the project.x64base.runtime 'dotscript' lane per AIF-040. Owns the arrays lane (AIF-038, arrays RUNTIME-LIVE 2026-08; spec normative) and the incoming tuple field-type extension lane; stop_on_error (AIF-036) and the comment lexer (AIF-037) are proven surfaces here. 2026-08-12 (owner directive, DotScript-as-product pass) -- two lanes added for the externally-evaluated critical gaps, both under AIF-109 (the product-gap umbrella) -- functions_procedures (call frames, parameters, LOCAL, RETURN; removes the 1-subscript nesting limit; promotes DEFFN/DEFCMD from text macros on seams they already own; semantics pre-ruled by ARRAYS_SPEC s19) and error_handling (structured ON ERROR / TRY, extending the s29 message-id contract; distinct from errorstop's threshold). Prior-art findings and the five pending owner rulings are in DOTSCRIPT_FUNCTION_SURFACE_PRIOR_ART_V1.md. Runtime truth still originates in project.x64base.runtime.


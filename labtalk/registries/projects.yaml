    notes: >-
      PDLC/PLDC teaching project for carrying a stable business dataset through
      COBOL fixed-length records, xBase/DBF, CODASYL-style relationships, JSON,
      CSV, spreadsheets, SQLite/SQL, and x64base comparison. Existing runtime
      starters and sample packages are assembled first; historical cases remain
      review-labeled; GnuCOBOL acknowledgement is required before promotion.
      The benchmark lane compares equivalent x64base and SQLite workloads on the
      same machine and reports configuration-specific results only.


      - labtalk/LABTALK_SDLC_FRAMEWORK_v0.md
      - labtalk/registries/projects.yaml
    source_surfaces:
      - src/edu/edu_cobol.cpp
      - src/cli/cmd_codaysl.cpp
      - src/cli/cmd_sqlite.cpp
      - src/edu/edu_bibletalk.cpp
      - src/edu/edu_erp.cpp

next_gate: 'Write the side-by-side exercise. x64base is unusual in carrying BOTH methodologies over one
  engine and one dataset: REL walks children from the record the cursor is sitting on (move the cursor,
  the answer changes), while SQLSEL evaluates a statement that names its own table and leaves every cursor
  untouched. Most students only ever meet the set model and never see the cursor machinery underneath
  it. Same data, same keys, same equality rules, two answers with different shapes -- and a SQLite oracle
  to check both against. Needs one runnable lab file before promotion to draft.'

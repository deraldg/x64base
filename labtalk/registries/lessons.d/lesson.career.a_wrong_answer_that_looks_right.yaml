next_gate: 'Three defects found in one lane shared a shape: a scan that stopped at its limit and reported
  a partial result as complete; a SELECT statement the parser could not read, which scanned 200 records
  and answered "0"; a boolean that stringified to nothing so a proof marker silently vanished. None raised
  an error. Each returned something a reader would accept. A crash is a gift by comparison -- it tells
  you where to look. The remedy is not more testing but a design rule: separate the error axis from the
  value axis, so a FAILURE reports while a legitimate blank stays quiet. Add the before/after transcript
  pair as the exhibit, then promote.'

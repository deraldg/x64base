; ============================================================================
; vdisk.ini  -  optional admin config for the RAM virtual disk (AIF-043)
; ----------------------------------------------------------------------------
; This file is OPTIONAL and INERT as shipped: every line below is commented, so
; the engine parses no [vdisk] block and the feature stays off (VDISK MOUNT / DO
; mem behave exactly as they do without this file). Uncomment the block to opt in.
;
; It is NOT a DotTalk script (unlike dottalkpp.ini / init.ini). It is a true INI
; file read by its own parser: [vdisk] section, key = value, ; or # comments.
;
; Primary M1 substrate is the in-process VFS (xbase::ramfs) — no driver needed.
; The `root` override + symlink route here are for the OPTIONAL LMDB-in-RAM add-on
; (LMDB must mmap a real OS file, so it cannot live in the in-process VFS).
;
; Spec: VDISK_RAM_SIZING_AND_ADMIN_CONFIG_V1.  Inspect live values with: VDISK CONFIG
; ============================================================================

; [vdisk]
; enabled   = 1                   ; 0 = disable RAM residency (treat mem intent as plain disk)
; root      = D:\ramdisk\dottalk  ; symlink/junction target (the RAM volume); empty = use SET PATH RAM
; mode      = auto                ; auto | fixed | percent  (Layer-1 sizing recommendation)
; size_mb   = 512                 ; used when mode = fixed
; percent   = 25                  ; used when mode = percent (of available RAM)
; floor_mb  = 64                  ; clamps even fixed/percent overrides
; ceil_mb   = 2048                ; clamps even fixed/percent overrides
; warn_pct  = 80                  ; Layer-2 high-water warning (% of the budget)
; on_full   = warn                ; warn | spill | fail   (Layer-2 policy at 100%)

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">DotTalk++ command reference harvest</title>
  <desc id="desc">The central command registry and usage contracts are joined, drift checked, reviewed, and projected into the command catalog.</desc>
  <rect width="1120" height="620" fill="#f4f7f8"/>
  <text x="56" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#172334">Command Reference Harvest</text>
  <text x="56" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#53626e">One source-derived count path keeps the catalog and its diagram synchronized.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3d4a54"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="56" y="166" width="218" height="118" rx="7" fill="#e8f4ef" stroke="#26705a" stroke-width="2"/>
    <text x="165" y="205" font-size="18" font-weight="700" fill="#172334">Central registry</text>
    <text x="165" y="235" font-size="27" font-weight="700" fill="#26705a">239</text>
    <text x="165" y="260" font-size="14" fill="#53626e">registered command keys</text>

    <rect x="326" y="166" width="218" height="118" rx="7" fill="#eef3fb" stroke="#416c9e" stroke-width="2"/>
    <text x="435" y="205" font-size="18" font-weight="700" fill="#172334">Usage contracts</text>
    <text x="435" y="235" font-size="27" font-weight="700" fill="#416c9e">239</text>
    <text x="435" y="260" font-size="14" fill="#53626e">matched source annotations</text>

    <rect x="596" y="166" width="218" height="118" rx="7" fill="#fff4dc" stroke="#a46a12" stroke-width="2"/>
    <text x="705" y="205" font-size="18" font-weight="700" fill="#172334">Joined candidate</text>
    <text x="705" y="235" font-size="16" fill="#53626e">names + category + status</text>
    <text x="705" y="260" font-size="14" fill="#53626e">fallback rows remain visible</text>

    <rect x="866" y="166" width="198" height="118" rx="7" fill="#f3eef8" stroke="#765694" stroke-width="2"/>
    <text x="965" y="205" font-size="18" font-weight="700" fill="#172334">Drift gate</text>
    <text x="965" y="235" font-size="15" fill="#53626e">membership + counts</text>
    <text x="965" y="260" font-size="14" fill="#53626e">joined-row defect checks</text>

    <rect x="326" y="395" width="488" height="116" rx="7" fill="#172334" stroke="#172334" stroke-width="2"/>
    <text x="570" y="436" font-size="20" font-weight="700" fill="#ffffff">Reviewed command catalog</text>
    <text x="570" y="466" font-size="15" fill="#d8e2ea">Source-derived website page + count-matched diagram</text>
    <text x="570" y="491" font-size="14" fill="#a9bbc8">Runtime and source remain authoritative</text>
  </g>
  <g stroke="#3d4a54" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <path d="M274 225 H326"/>
    <path d="M544 225 H596"/>
    <path d="M814 225 H866"/>
    <path d="M965 284 C965 354 760 350 704 395"/>
    <path d="M165 284 C165 354 380 350 436 395"/>
  </g>
</svg>

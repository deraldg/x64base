<svg viewBox="0 0 1240 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrowFade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="48" font-size="27" font-weight="700" fill="#0f172a">Persistent Memory for Artificial Minds</text>
  <text x="40" y="76" font-size="15" fill="#64748b">Consolidation pipeline, recall graph, and BBS substrate. Not total memory: selective forgetting with reliable recall of what mattered.</text>

  <!-- ============ BAND 1: CONSOLIDATION PIPELINE ============ -->
  <text x="40" y="122" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">CONSOLIDATION  (left to right = a session becoming permanent)</text>

  <!-- Live session -->
  <rect x="40" y="150" width="150" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="186" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Live Session</text>
  <text x="115" y="208" font-size="12" fill="#3b82f6" text-anchor="middle">AI + human,</text>
  <text x="115" y="224" font-size="12" fill="#3b82f6" text-anchor="middle">reasoning now</text>

  <!-- Sensory / buffer -->
  <rect x="230" y="150" width="150" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="305" y="182" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Sensory / Buffer</text>
  <text x="305" y="204" font-size="12" fill="#64748b" text-anchor="middle">Raw transcript</text>
  <text x="305" y="220" font-size="12" fill="#64748b" text-anchor="middle">seconds, discarded</text>

  <!-- Short-term / working -->
  <rect x="420" y="150" width="160" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="500" y="180" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">Short-term /</text>
  <text x="500" y="199" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">Working</text>
  <text x="500" y="221" font-size="12" fill="#6366f1" text-anchor="middle">decay clock: days</text>

  <!-- Triage gate -->
  <rect x="628" y="142" width="168" height="102" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="712" y="176" font-size="16" font-weight="800" fill="#92400e" text-anchor="middle">TRIAGE</text>
  <text x="712" y="196" font-size="11.5" fill="#b45309" text-anchor="middle">deferred "sleep"</text>
  <text x="712" y="212" font-size="11.5" fill="#b45309" text-anchor="middle">value function</text>
  <text x="712" y="230" font-size="11.5" font-weight="600" fill="#92400e" text-anchor="middle">the heart of it</text>

  <!-- Permanent store (three) -->
  <rect x="850" y="128" width="200" height="130" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="950" y="150" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">PERMANENT STORE</text>
  <rect x="866" y="160" width="168" height="26" rx="6" fill="#dcfce7"/>
  <text x="950" y="178" font-size="12" fill="#15803d" text-anchor="middle">Semantic  (facts, conventions)</text>
  <rect x="866" y="192" width="168" height="26" rx="6" fill="#dcfce7"/>
  <text x="950" y="210" font-size="12" fill="#15803d" text-anchor="middle">Episodic  (what happened, why)</text>
  <rect x="866" y="224" width="168" height="26" rx="6" fill="#dcfce7"/>
  <text x="950" y="242" font-size="12" fill="#15803d" text-anchor="middle">Procedural  (how-to, rules)</text>

  <!-- flow arrows -->
  <line x1="190" y1="193" x2="228" y2="193" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="193" x2="418" y2="193" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="193" x2="626" y2="193" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="796" y1="193" x2="848" y2="193" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="820" y="184" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">promote</text>

  <!-- discard path -->
  <path d="M712,244 L712,300" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowFade)"/>
  <text x="722" y="288" font-size="12" fill="#94a3b8">discard: most of a session fades (forgetting is a feature)</text>

  <!-- value signals feeding triage -->
  <text x="628" y="112" font-size="11" font-weight="700" fill="#b45309">value signals -></text>
  <g font-size="11" fill="#92400e">
    <rect x="470" y="86" width="82" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="511" y="101" text-anchor="middle">acted-upon</text>
  </g>

  <!-- ============ BAND 2: RECALL GRAPH ============ -->
  <text x="40" y="360" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">RECALL  (the inverse of triage: query -> traverse -> restore just enough context)</text>

  <!-- graph panel -->
  <rect x="40" y="380" width="620" height="300" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="60" y="408" font-size="14" font-weight="700" fill="#6b21a8">Associative graph: typed, strength-weighted links ("synapses")</text>
  <text x="60" y="428" font-size="11.5" fill="#7c3aed">strength decays with disuse, reinforces on recall; unused links fade</text>

  <!-- graph edges -->
  <line x1="180" y1="500" x2="330" y2="470" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="235" y="476" font-size="10.5" fill="#6b21a8" font-weight="600">supports</text>
  <line x1="180" y1="500" x2="300" y2="600" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="205" y="565" font-size="10.5" fill="#a78bfa">arose-from</text>
  <line x1="330" y1="470" x2="500" y2="510" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="405" y="480" font-size="10.5" fill="#6b21a8" font-weight="600">supersedes</text>
  <line x1="300" y1="600" x2="500" y2="510" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="330" y1="470" x2="300" y2="600" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="285" y="545" font-size="10.5" fill="#a78bfa" transform="rotate(75 300 545)">contradicts</text>

  <!-- graph nodes -->
  <circle cx="180" cy="500" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="180" y="504" font-size="11" fill="#5b21b6" text-anchor="middle">mem A</text>
  <circle cx="330" cy="470" r="34" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><text x="330" y="474" font-size="11" fill="#5b21b6" text-anchor="middle" font-weight="700">mem B</text>
  <circle cx="500" cy="510" r="28" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/><text x="500" y="514" font-size="11" fill="#5b21b6" text-anchor="middle">mem C</text>
  <circle cx="300" cy="600" r="26" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="300" y="604" font-size="10.5" fill="#7c3aed" text-anchor="middle">mem D</text>
  <text x="368" y="452" font-size="9.5" fill="#94a3b8">thick = strong / often-recalled</text>

  <!-- New session box + loop -->
  <rect x="720" y="470" width="150" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="795" y="502" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">New Session</text>
  <text x="795" y="524" font-size="12" fill="#3b82f6" text-anchor="middle">wakes with a</text>
  <text x="795" y="540" font-size="12" fill="#3b82f6" text-anchor="middle">working set</text>

  <!-- permanent store into graph -->
  <path d="M950,258 L950,330 L360,330 L360,436" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="640" y="322" font-size="11" fill="#15803d" font-weight="600">promoted memories populate the graph</text>

  <!-- graph to new session -->
  <line x1="660" y1="513" x2="718" y2="513" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="689" y="504" font-size="10.5" fill="#6b21a8" text-anchor="middle" font-weight="600">recall</text>

  <!-- loop close back to live session -->
  <path d="M795,470 L795,270 L1120,270 L1120,760 L115,760 L115,238" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="1130" y="515" font-size="12" fill="#3b82f6" transform="rotate(90 1130 515)">next session carries yesterday forward</text>

  <!-- ============ BAND 3: SUBSTRATE ============ -->
  <text x="40" y="712" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">SUBSTRATE  (already exists on the Portal + DotTalk++ BBS; new layer sits on top)</text>
  <rect x="40" y="726" width="1010" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

  <rect x="62" y="750" width="228" height="76" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="176" y="782" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">BBS bus</text>
  <text x="176" y="802" font-size="11.5" fill="#64748b" text-anchor="middle">shared memory between</text>
  <text x="176" y="817" font-size="11.5" fill="#64748b" text-anchor="middle">isolated sessions</text>

  <rect x="304" y="750" width="228" height="76" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="782" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">DBF store</text>
  <text x="418" y="802" font-size="11.5" fill="#64748b" text-anchor="middle">durable semantic +</text>
  <text x="418" y="817" font-size="11.5" fill="#64748b" text-anchor="middle">episodic memory</text>

  <rect x="546" y="750" width="228" height="76" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="660" y="782" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Cross-process locking</text>
  <text x="660" y="802" font-size="11.5" fill="#64748b" text-anchor="middle">concurrent sessions</text>
  <text x="660" y="817" font-size="11.5" fill="#64748b" text-anchor="middle">write memory safely</text>

  <rect x="788" y="750" width="240" height="76" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="908" y="782" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">In-memory catalog</text>
  <text x="908" y="802" font-size="11.5" fill="#64748b" text-anchor="middle">holds the working set</text>
  <text x="908" y="817" font-size="11.5" fill="#64748b" text-anchor="middle">at recall time</text>

  <!-- value signal chips row (moved for clarity) -->
  <g font-size="10.5" fill="#92400e">
    <rect x="1076" y="150" width="140" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/><text x="1146" y="167" text-anchor="middle">costly-to-learn</text>
    <rect x="1076" y="184" width="140" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/><text x="1146" y="201" text-anchor="middle">re-referenced</text>
    <rect x="1076" y="218" width="140" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/><text x="1146" y="235" text-anchor="middle">contradiction</text>
    <rect x="1076" y="252" width="140" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/><text x="1146" y="269" text-anchor="middle">novelty / surprise</text>
  </g>
  <text x="1146" y="140" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">TRIAGE value signals</text>
  <path d="M1076,220 C980,240 850,235 798,215" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>
</svg>

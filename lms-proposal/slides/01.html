    for (var i = 0; i < children.length; i++) {

      if (childTag === 'IMG' || childTag === 'SVG') return true;
    }
    return false;
  }

  // Returns the data-id value for an element
  function getSlotId(el) {
    return el.getAttribute('data-id') || '';
  }

  // Find an element by its data-id value
  function findByDataId(dataId) {
    return document.querySelector('[data-id="' + dataId.replace(/"/g, '\"') + '"]');
  }

  // Determines if a [data-id] element should be selectable:
  // - Has direct text content (editable element) OR
  // - Has mixed content (child elements AND direct text nodes) OR
  // - Is an img/svg tag OR
  // - Contains a direct child img/svg
  function isSelectableElement(el) {
    var tag = el.tagName.toUpperCase();
    if (SKIP_TAGS[tag]) return false;
    if (tag === 'IMG' || tag === 'SVG') return true;

    // Check if element has meaningful text content (not just whitespace).
    // Ignore <br> tags when counting children so line-broken text is still selectable.
    var children = el.children;
    var nonBrChildren = 0;
    for (var j = 0; j < children.length; j++) {
      if (children[j].tagName.toUpperCase() !== 'BR') nonBrChildren++;
    }
    if (el.textContent && el.textContent.trim().length > 0 && nonBrChildren === 0) return true;

    // Mixed content: element has both child elements AND direct text nodes.
    // e.g. <li><span>Nvidia</span> retreat on reports...</li>
    // The bare text is not inside any child element and needs the parent to be selectable.
    if (nonBrChildren > 0) {
      var childNodes = el.childNodes;
      for (var k = 0; k < childNodes.length; k++) {
        if (childNodes[k].nodeType === 3 && childNodes[k].textContent.trim().length > 0) return true;
      }
    }

    for (var i = 0; i < children.length; i++) {
      var childTag = children[i].tagName.toUpperCase();
      if (childTag === 'IMG' || childTag === 'SVG') return true;
    }
    return false;
  }

  function activateElement(el) {
    activeElement = el;
    originalContentMap[getSlotId(el)] = el.innerHTML;
    el.style.outline = '2.5px solid #987AEE';
    el.style.outlineOffset = '2px';
    el.style.borderRadius = '6px';
    overrideAncestorOverflow(el);
    if (!isImageElement(el)) {
      el.contentEditable = 'true';
      el.focus({ preventScroll: true });
    }
  }

  function notifyElementSelected(el) {
    var rect = el.getBoundingClientRect();
    var isImage = isImageElement(el);
    var elementType = isImage ? 'image' : (el.dataset?.elementType || 'text');
    var value = isImage ? el.outerHTML : el.textContent;
    window.parent.postMessage({
      type: 'element_selected',
      slotId: getSlotId(el),
      elementType: elementType,
      value: value,
      styles: isImage ? undefined : getElementStyles(el),
      bounds: { top: rect.top, left: rect.left, width: rect.width, height: rect.height }
    }, '*');
  }

  function isInBorderZone(rect, clientX, clientY, innerThreshold, outerThreshold) {
    var expandedLeft = rect.left - outerThreshold;
    var expandedRight = rect.right + outerThreshold;
    var expandedTop = rect.top - outerThreshold;
    var expandedBottom = rect.bottom + outerThreshold;
    if (clientX < expandedLeft || clientX > expandedRight || clientY < expandedTop || clientY > expandedBottom) {
      return false;
    }
    var contentLeft = rect.left + innerThreshold;
    var contentRight = rect.right - innerThreshold;
    var contentTop = rect.top + innerThreshold;
    var contentBottom = rect.bottom - innerThreshold;
    var inContentArea = clientX >= contentLeft && clientX <= contentRight && clientY >= contentTop && clientY <= contentBottom;
    return !inContentArea;
  }


  function setupElement(el) {
    if (el.dataset.selectionInitialized) return;
    el.dataset.selectionInitialized = 'true';
    
    var elIsImage = isImageElement(el);
    el.style.cursor = elIsImage ? 'pointer' : 'text';
    
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var isNewSelection = activeElement !== el;
      var needsReactivation = !isNewSelection && el.contentEditable !== 'true';
      var rect = el.getBoundingClientRect();
      var clickedOnBorder = isInBorderZone(rect, e.clientX, e.clientY, INNER_THRESHOLD, OUTER_THRESHOLD);
      
      if (isNewSelection) {
        deactivateElement();
        activateElement(el);
      } else if (needsReactivation && !elIsImage) {
        activateElement(el);
      }
      
      if (!elIsImage) {
        if (clickedOnBorder) {
          selectNode(el);
        } else {
          var currentSelection = window.getSelection();
          var hasTextSelected = currentSelection && currentSelection.toString().length > 0;
          if (e.detail === 1 && !hasTextSelected) {
            placeCaretAtPoint(e.clientX, e.clientY);
          }
        }
      }
      notifyElementSelected(el);
    });
    
    var blurTimeout = null;
    
    el.addEventListener('blur', function() {
      var wasActiveAtBlur = el === activeElement;
      blurTimeout = setTimeout(function() {
        var elKey = getSlotId(el);
        var currentHtml = el.innerHTML;
        var originalContent = originalContentMap[elKey];
        var contentChanged = wasActiveAtBlur && originalContent !== undefined && currentHtml !== originalContent;
        if (!elIsImage) {
          el.removeAttribute('contenteditable');
        }
        var message = { type: 'element_blur', slotId: elKey };
        if (contentChanged) message.html = getBodyHtml();
        window.parent.postMessage(message, '*');
        delete originalContentMap[elKey];
      }, 150);
    });
    
    el.addEventListener('focus', function() {
      if (blurTimeout) { clearTimeout(blurTimeout); blurTimeout = null; }
    });
    
    el.addEventListener('keydown', function(e) {
      if (elIsImage) return;
      if (e.key === 'Backspace' && el.textContent.trim() === '') {
        e.preventDefault();
        var elKey = getSlotId(el);
        el.remove();
        activeElement = null;
        delete originalContentMap[elKey];
        window.parent.postMessage({ type: 'element_deleted', slotId: elKey, html: getBodyHtml() }, '*');
      }
    });
    
    el.addEventListener('mouseenter', function() {
      if (el !== activeElement) {
        el.style.outline = '1.5px solid rgba(59, 130, 246, 0.5)';
        el.style.outlineOffset = '2px';
        el.style.borderRadius = '6px';
      }
    });
    
    el.addEventListener('mouseleave', function() {
      if (el !== activeElement) {
        el.style.outline = 'none';
        el.style.outlineOffset = '';
        el.style.borderRadius = '';
      }
      el.style.cursor = elIsImage ? 'pointer' : 'text';
    });
    
    el.addEventListener('mousemove', function(e) {
      if (elIsImage) return;
      var rect = el.getBoundingClientRect();
      el.style.cursor = isInBorderZone(rect, e.clientX, e.clientY, INNER_THRESHOLD, OUTER_THRESHOLD) ? 'pointer' : 'text';
    });
  }

  // Initialize only elements that are meaningful editable content
  function initializeElements() {
    var allElements = document.querySelectorAll(SELECTABLE_SELECTOR);
    for (var i = 0; i < allElements.length; i++) {
      if (isSelectableElement(allElements[i])) {
        setupElement(allElements[i]);
      }
    }
  }


  // Collect all initialized selectable elements for hit-testing
  function getSelectableElements() {
    return document.querySelectorAll('[data-selection-initialized]');
  }

  function setupBodyListeners() {
    if (!document.body) return;
    
    document.body.addEventListener('click', function(e) {
      window.parent.postMessage({ type: 'iframe_clicked' }, '*');
      
      // Check if click target is inside an initialized element
      var closestInitialized = e.target.closest('[data-selection-initialized]');
      if (closestInitialized) return; // Element's own click handler will fire
      
      // Click was not directly on an initialized element — check via bounding rects
      // (handles CSS overlays, pseudo-elements blocking the actual element)
      var elements = getSelectableElements();
      for (var i = 0; i < elements.length; i++) {
        var el = elements[i];
        var rect = el.getBoundingClientRect();

        // For image elements, check if click is anywhere inside bounding rect
        if (isImageElement(el)) {
          if (e.clientX >= rect.left && e.clientX <= rect.right &&
              e.clientY >= rect.top && e.clientY <= rect.bottom) {
            e.stopPropagation();
            deactivateElement();
            activateElement(el);
            notifyElementSelected(el);
            return;
          }
        }
        if (isInBorderZone(rect, e.clientX, e.clientY, INNER_THRESHOLD, OUTER_THRESHOLD)) {
          e.stopPropagation();
          deactivateElement();
          activateElement(el);
          if (!isImageElement(el)) {
            selectNode(el);
          }
          notifyElementSelected(el);
          return;
        }
      }
      window.parent.postMessage({ type: 'element_deselected' }, '*');
    });
    
    document.body.addEventListener('mousemove', function(e) {
      if (e.target.closest('[data-selection-initialized]')) return;
      var elements = getSelectableElements();
      for (var i = 0; i < elements.length; i++) {
        var rect = elements[i].getBoundingClientRect();
        if (isImageElement(elements[i])) {
          if (e.clientX >= rect.left && e.clientX <= rect.right &&
              e.clientY >= rect.top && e.clientY <= rect.bottom) {
            document.body.style.cursor = 'pointer';
            return;
          }
        }
        if (isInBorderZone(rect, e.clientX, e.clientY, INNER_THRESHOLD, OUTER_THRESHOLD)) {
          document.body.style.cursor = 'pointer';
          return;
        }
      }
      document.body.style.cursor = '';
    });
    
    document.body.addEventListener('mouseup', function(e) {
      var selection = window.getSelection();
      var hasSelection = selection && selection.toString().length > 0;
      if (!hasSelection) return;
      
      var range = selection.rangeCount > 0 ? selection.getRangeAt(0).cloneRange() : null;
      if (!range) return;
      
      var container = range.commonAncestorContainer;
      if (container.nodeType === 3) container = container.parentNode;
      var slotElement = container.closest ? container.closest('[data-selection-initialized]') : null;
      if (!slotElement) return;
      
      if (slotElement !== activeElement) {
        deactivateElement();
        activateElement(slotElement);
        selection.removeAllRanges();
        selection.addRange(range);
        notifyElementSelected(slotElement);
      }
    });
  }


  document.addEventListener('selectionchange', function() {
    var selection = window.getSelection();
    var selectedText = selection ? selection.toString() : '';
    var hasSelection = selectedText.length > 0;
    var message = { type: 'selection_changed', hasSelection: hasSelection, selectedText: selectedText };
    
    if (hasSelection) {
      var styles = getSelectionStyles();
      if (styles) message.styles = styles;
      if (selection.rangeCount > 0) {
        var rect = selection.getRangeAt(0).getBoundingClientRect();
        message.bounds = { top: rect.top, left: rect.left, width: rect.width, height: rect.height };
      } else if (activeElement) {
        var rect = activeElement.getBoundingClientRect();
        message.bounds = { top: rect.top, left: rect.left, width: rect.width, height: rect.height };
      }
    }
    window.parent.postMessage(message, '*');
  });


  function applyToSelection(selection, range, command, styleProp, styleValue, styleMap) {
    if (range.collapsed) return;
    
    var existingSpan = getContainingSpan(range);
    if (existingSpan) {
      var isTurningOffSpan = styleValue === styleMap[command].offValue;
      var spanHasStyleExplicitly = existingSpan.style[styleProp] && existingSpan.style[styleProp] !== '';
      if (isTurningOffSpan && spanHasStyleExplicitly) {
        cleanupSpan(existingSpan, styleProp);
        if (existingSpan.parentNode) selectNode(existingSpan);
      } else {
        existingSpan.style[styleProp] = styleValue;
        selectNode(existingSpan);
      }
      return;
    }
    
    var isTurningOff = styleValue === styleMap[command].offValue;
    var styledAncestor = isTurningOff ? getStyledAncestor(range, styleProp) : null;
    
    if (styledAncestor) {
      var selectedText = range.toString();
      var beforeRange = document.createRange();
      beforeRange.setStart(styledAncestor, 0);
      beforeRange.setEnd(range.startContainer, range.startOffset);
      var beforeText = beforeRange.toString();
      
      var afterRange = document.createRange();
      afterRange.setStart(range.endContainer, range.endOffset);
      afterRange.setEnd(styledAncestor, styledAncestor.childNodes.length);
      var afterText = afterRange.toString();
      
      var parent = styledAncestor.parentNode;
      var styleCSS = styledAncestor.style.cssText;
      var unstyledCSS = styleCSS.replace(new RegExp(styleProp.replace(/([A-Z])/g, '-$1').toLowerCase() + '\\s*:\\s*[^;]+;?', 'gi'), '').trim();
      
      var newNodes = [];
      if (beforeText) {
        var beforeSpan = document.createElement('span');
        beforeSpan.style.cssText = styleCSS;
        beforeSpan.textContent = beforeText;
        newNodes.push(beforeSpan);
      }
      
      var middleNode;
      if (unstyledCSS) {
        middleNode = document.createElement('span');
        middleNode.style.cssText = unstyledCSS;
        middleNode.textContent = selectedText;
      } else {
        middleNode = document.createTextNode(selectedText);
      }
      newNodes.push(middleNode);
      
      if (afterText) {
        var afterSpan = document.createElement('span');
        afterSpan.style.cssText = styleCSS;
        afterSpan.textContent = afterText;
        newNodes.push(afterSpan);
      }
      
      newNodes.forEach(function(node) { parent.insertBefore(node, styledAncestor); });
      parent.removeChild(styledAncestor);
      activeElement.normalize();
      selectNode(middleNode);
      return;
    }
    
    if (isTurningOff && styleProp === 'textDecoration' && hasStyleValue(activeElement, styleProp)) {
      var selText = range.toString();
      var fullText = activeElement.textContent;
      var selStart = fullText.indexOf(selText);
      if (selStart === -1) selStart = 0;
      var beforeText = fullText.substring(0, selStart);
      var afterText = fullText.substring(selStart + selText.length);
      
      activeElement.style[styleProp] = '';
      activeElement.innerHTML = '';
      
      if (beforeText) {
        var beforeSpan = document.createElement('span');
        beforeSpan.style[styleProp] = 'underline';
        beforeSpan.textContent = beforeText;
        activeElement.appendChild(beforeSpan);
      }
      var middleNode = document.createTextNode(selText);
      activeElement.appendChild(middleNode);
      if (afterText) {
        var afterSpan = document.createElement('span');
        afterSpan.style[styleProp] = 'underline';
        afterSpan.textContent = afterText;
        activeElement.appendChild(afterSpan);
      }
      selectNode(middleNode);
      return;
    }
    
    var fragment = range.extractContents();
    
    if (isTurningOff) {
      fragment.querySelectorAll('span').forEach(function(span) { cleanupSpan(span, styleProp); });
      if (hasStyleValue(activeElement, styleProp)) {
        var overrideSpan = document.createElement('span');
        overrideSpan.style[styleProp] = styleValue;
        overrideSpan.appendChild(fragment);
        range.insertNode(overrideSpan);
        selectNode(overrideSpan);
      } else {
        range.insertNode(fragment);
      }
    } else {
      var span = document.createElement('span');
      span.style[styleProp] = styleValue;
      span.appendChild(fragment);
      span.querySelectorAll('span').forEach(function(nested) {
        if (nested.style[styleProp]) cleanupSpan(nested, styleProp);
      });
      range.insertNode(span);
      selectNode(span);
    }
  }


  window.addEventListener('message', function(e) {
    var data = e.data;
    if (data && data.type === 'slideCommand' && data.payload) {
      data = { type: data.payload.command, ...data.payload.data };
    }
    
    if (data.type === 'clear_selection') {
      deactivateElement();
      activeElement = null;
      window.parent.postMessage({ type: 'element_deselected' }, '*');
      return;
    }
    
    if (data.type === 'focus_active_element') {
      if (activeElement) {
        if (!isImageElement(activeElement)) {
          activeElement.contentEditable = 'true';
          originalContentMap[getSlotId(activeElement)] = activeElement.innerHTML;
        }
        activeElement.focus({ preventScroll: true });
      }
      return;
    }
    
    if (data.type === 'reload_content') {
      deactivateElement();
      activeElement = null;
      originalContentMap = {};
      
      if (!data.fullHtml || data.fullHtml.length === 0) {
        return;
      }
      
      var parser = new DOMParser();
      var doc = parser.parseFromString(data.fullHtml, 'text/html');
      
      var scripts = Array.from(document.head.querySelectorAll('script'));
      document.head.innerHTML = doc.head.innerHTML;
      scripts.forEach(function(s) { document.head.appendChild(s); });
      
      document.body.innerHTML = doc.body.innerHTML;
      
      // Re-initialize selectable elements after content reload
      var allElements = document.querySelectorAll(SELECTABLE_SELECTOR);
      for (var i = 0; i < allElements.length; i++) {
        if (isSelectableElement(allElements[i])) {
          setupElement(allElements[i]);
        }
      }
      window.parent.postMessage({ type: 'content_reloaded' }, '*');
      return;
    }
    
    if (data.type === 'replace_text' && data.id) {
      // Look up by data-id
      var element = findByDataId(data.id);
      if (element) element.textContent = data.newText || '';
      return;
    }
    
    if (data.type === 'replace_text' && activeElement) {
      var selection = window.getSelection();
      var selectedText = selection ? selection.toString() : '';
      
      if (selection && selection.rangeCount > 0 && selectedText.length > 0) {
        var range = selection.getRangeAt(0);
        var container = range.commonAncestorContainer;
        var parentSpan = container.nodeType === 3 ? container.parentNode : container;
        var styleSource = activeElement;
        var isInsideStyledSpan = parentSpan && parentSpan.tagName === 'SPAN' && parentSpan !== activeElement && activeElement.contains(parentSpan);
        if (isInsideStyledSpan) styleSource = parentSpan;
        
        var computedStyles = window.getComputedStyle(styleSource);
        var hasBold = computedStyles.fontWeight === 'bold' || parseInt(computedStyles.fontWeight, 10) >= 700;
        var hasItalic = computedStyles.fontStyle === 'italic';
        var hasUnderline = (computedStyles.textDecorationLine || computedStyles.textDecoration).includes('underline');
        var hasCustomColor = computedStyles.color && computedStyles.color !== 'rgb(0, 0, 0)';
        var hasCustomFontSize = computedStyles.fontSize && computedStyles.fontSize !== '16px';
        var hasAnyStyle = hasBold || hasItalic || hasUnderline || hasCustomColor || hasCustomFontSize;
        
        if (hasAnyStyle || isInsideStyledSpan) {
          var newSpan = document.createElement('span');
          if (hasBold) newSpan.style.fontWeight = 'bold';
          if (hasItalic) newSpan.style.fontStyle = 'italic';
          if (hasUnderline) newSpan.style.textDecoration = 'underline';
          if (computedStyles.color) newSpan.style.color = computedStyles.color;
          if (computedStyles.fontSize) newSpan.style.fontSize = computedStyles.fontSize;
          newSpan.textContent = data.newText;
          range.deleteContents();
          range.insertNode(newSpan);
          activeElement.normalize();
          selectNode(newSpan);
        } else {
          range.deleteContents();
          var textNode = document.createTextNode(data.newText);
          range.insertNode(textNode);
          activeElement.normalize();
          var newRange = document.createRange();
          newRange.selectNodeContents(textNode);
          selection.removeAllRanges();
          selection.addRange(newRange);
        }
      } else {
        activeElement.textContent = data.newText;
      }
      
      window.parent.postMessage({ type: 'text_replaced', slotId: getSlotId(activeElement), html: getBodyHtml() }, '*');
      return;
    }
    
    if (data.type !== 'format_command' || !activeElement) return;
    
    var command = data.command;
    var value = data.value;
    var isOn = value === 'true' || value === true;
    
    var selection = window.getSelection();
    var selectedText = selection ? selection.toString() : '';
    var fullText = activeElement.textContent || '';
    var isFullSelection = selectedText.length > 0 && selectedText === fullText;
    
    var styleMap = {
      'bold': { prop: 'fontWeight', onValue: 'bold', offValue: 'normal' },
      'italic': { prop: 'fontStyle', onValue: 'italic', offValue: 'normal' },
      'underline': { prop: 'textDecoration', onValue: 'underline', offValue: 'none' },
      'fontSize': { prop: 'fontSize', onValue: value + 'px', offValue: null },
      'fontColor': { prop: 'color', onValue: value, offValue: null }
    };
    
    var styleInfo = styleMap[command];
    if (!styleInfo) return;
    
    var styleValue = (command === 'fontSize' || command === 'fontColor') 
      ? styleInfo.onValue 
      : (isOn ? styleInfo.onValue : styleInfo.offValue);
    
    if (isFullSelection) {
      activeElement.style[styleInfo.prop] = styleValue;
      activeElement.querySelectorAll('span').forEach(function(span) { cleanupSpan(span, styleInfo.prop); });
      activeElement.querySelectorAll('*').forEach(function(child) {
        if (child.style && child.style[styleInfo.prop]) {
          child.style[styleInfo.prop] = '';
        }
        if (styleInfo.prop === 'color') {
          child.style.color = 'inherit';
        }
      });
    } else if (selection && selection.rangeCount > 0) {
      applyToSelection(selection, selection.getRangeAt(0), command, styleInfo.prop, styleValue, styleMap);
    }
    
    activeElement.normalize();
    
    window.parent.postMessage({
      type: 'element_style_updated',
      slotId: getSlotId(activeElement),
      styles: getElementStyles(activeElement),
      html: getBodyHtml()
    }, '*');
    
    var updatedSelStyles = getSelectionStyles();
    var currentSelection = window.getSelection();
    var currentSelectedText = currentSelection ? currentSelection.toString() : '';
    window.parent.postMessage({
      type: 'selection_changed',
      hasSelection: currentSelectedText.length > 0,
      selectedText: currentSelectedText,
      styles: updatedSelStyles
    }, '*');
  });


  var isMouseDown = false;
  document.addEventListener('mousedown', function() { isMouseDown = true; });
  document.addEventListener('mouseup', function() { isMouseDown = false; });

  // Auto-activate the first selectable element when iframe gains keyboard focus.
  window.addEventListener('focus', function() {
    if (isMouseDown) return;
    if (!activeElement) {
      var elements = Array.from(getSelectableElements());
      if (elements.length > 0) {
        activateElement(elements[0]);
        notifyElementSelected(elements[0]);
      }
    }
  });

  // Prevent focus-induced scrolling inside the slide.
  function resetScroll() {
    if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
  }
  window.addEventListener('scroll', resetScroll, { passive: false });

  // Tab navigation between selectable elements
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Tab') return;

    var tabDirection = e.shiftKey ? 'backward' : 'forward';

    var elements = Array.from(getSelectableElements());
    if (elements.length === 0) return;

    // If text is selected and an element is active, let Tab flow
    // naturally to the formatting toolbar in the parent frame.
    if (activeElement && !e.shiftKey) {
      var selection = window.getSelection();
      var hasSelection = selection && selection.toString().length > 0;
      if (hasSelection) {
        e.preventDefault();
        // Don't null activeElement — focus_active_element needs it
        // when Shift+Tab returns from the toolbar.
        deactivateElement();
        // Tell the parent to focus the formatting toolbar
        window.parent.postMessage({ type: 'tab_to_toolbar' }, '*');
        return;
      }
    }

    // Navigate to next/previous selectable element
    var currentIndex = activeElement ? elements.indexOf(activeElement) : -1;
    var nextIndex;
    var atBoundary = false;

    if (e.shiftKey) {
      if (currentIndex <= 0) {
        atBoundary = true;
      } else {
        nextIndex = currentIndex - 1;
      }
    } else {
      if (currentIndex >= elements.length - 1) {
        atBoundary = true;
      } else {
        nextIndex = currentIndex + 1;
      }
    }

    // At boundary: tell parent to move focus to prev/next slide.
    // Browsers cannot reliably Tab out of nested sandboxed iframes,
    // so we always preventDefault and let the parent handle it.
    if (atBoundary) {
      e.preventDefault();
      deactivateElement();
      activeElement = null;
      window.parent.postMessage({ type: 'tab_exit', direction: tabDirection }, '*');
      return;
    }

    e.preventDefault();
    deactivateElement();
    activateElement(elements[nextIndex]);
    notifyElementSelected(elements[nextIndex]);
  });


  function initialize() {
    initializeElements();
    setupBodyListeners();
  }

  if (document.body) {
    initialize();
  } else {
    document.addEventListener('DOMContentLoaded', initialize);
  }

})();
</script>
</body></html>
